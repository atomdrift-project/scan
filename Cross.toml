# cross starts each build container with a clean environment apart from a small
# built-in allowlist, so anything cc-rs needs has to be named here explicitly.
#
# The vendored unrar sources in unrar_sys use `ptrdiff_t` in cmddata.cpp without
# including <cstddef>. Older libstdc++ pulled it in transitively; the newer GCC
# in the s390x and powerpc64le images does not, so those two builds fail with
# "'ptrdiff_t' was not declared in this scope". Force the include for just those
# targets rather than globally — the musl, illumos and riscv64gc images compile
# the same file without it, and there is no reason to perturb builds that work.
#
# cc-rs only applies CXXFLAGS to C++ compilation, so these cannot leak into the
# C sources in the same crates.
#
# illumos hides the LE_16/BE_16 macros from <sys/byteorder.h> in strict C99
# mode unless extensions are enabled. tree-sitter's portable endian header
# uses those macros, so enable the illumos extension namespace for that target
# rather than allowing the unresolved macro calls to reach the linker.
[build.env]
passthrough = [
    "CXXFLAGS_s390x_unknown_linux_gnu",
    "CXXFLAGS_powerpc64le_unknown_linux_gnu",
    "CFLAGS_x86_64_unknown_illumos",
]

# Cross's 0.2.5 images are immutable here even though the CLI must come from a
# newer revision for LoongArch std provisioning. The LoongArch images are from
# Cross main at the reviewed CLI revision and are pinned by manifest digest as
# well. Updating any image is therefore a visible supply-chain change.
[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:77db671d8356a64ae72a3e1415e63f547f26d374fbe3c4762c1cd36c7eac7b99"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4"

[target.arm-unknown-linux-musleabihf]
image = "ghcr.io/cross-rs/arm-unknown-linux-musleabihf@sha256:283b8271593b7f2504d8b84f6f01e0a3e005802b784d90f357e1ce283a7554f9"

[target.armv7-unknown-linux-musleabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-musleabihf@sha256:b4f481f30ceca34730a5723f717396d762d94f6eddd7e1cf7c7862d1377ff98c"

[target.loongarch64-unknown-linux-musl]
