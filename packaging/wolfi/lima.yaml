# Lima VM template for building ascan Wolfi packages on macOS.
# Mirrors cleave/packaging/wolfi/lima.yaml; kept as a separate VM so
# each project can be iterated on independently without one's build
# breaking the other's environment.
#
# Placeholders (__SRC_DIR__, __OUT_DIR__, __CACHE_DIR__) are substituted
# with absolute paths by scripts/bootstrap-lima.sh at VM creation time.

# Ubuntu 26.04 LTS (Resolute Raccoon).
images:
  - location: "https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# The wolfi build uses scan's `release-lto` profile (lto="fat" +
# codegen-units=1), which exhausts ~10GB during the final link step
# (cleave + filefacts compile in via the [patch] override). 12GiB
# headroom matches the cleave-wolfi VM and survives the link with
# room to spare.
cpus: 4
memory: "12GiB"
disk: "30GiB"

# __SRC_DIR__ is the PARENT of the scan repo so both `scan/` and
# its sibling `cleave/` are visible (for the [patch] override).
mounts:
  - location: "__SRC_DIR__"
    mountPoint: "/work/src"
    writable: false
  - location: "__OUT_DIR__"
    mountPoint: "/work/out"
    writable: true
  - location: "__CACHE_DIR__"
    mountPoint: "/work/cache"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      if ! command -v nerdctl >/dev/null 2>&1; then
        NERDCTL_VERSION=2.3.1
        ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        curl -fsSL "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-full-${NERDCTL_VERSION}-linux-${ARCH}.tar.gz" \
          | tar -xz -C /usr/local
        systemctl daemon-reload || true
        systemctl enable --now containerd || true
        systemctl enable --now buildkit || true
      fi

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
