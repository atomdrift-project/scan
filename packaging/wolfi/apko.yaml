# Local OCI image for ascan. NOT upstreamed — Wolfi only hosts apks.
# Pulls ascan + ascan-models from the local melange-built repo, plus
# cleave + cleave-traits from the cleave packaging output (same repo
# path; the build script ensures the cleave apks are present).

contents:
  repositories:
    - /out/packages
    - https://packages.wolfi.dev/os
  keyring:
    - /out/melange.rsa.pub
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - cleave
    - cleave-traits
    - ascan
    - ascan-models

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/ascan

environment:
  CLEAVE_TRAITS_DIR: /usr/share/cleave/traits
  SCAN_MODELS_DIR: /usr/share/atomdrift/scan/models/azoth
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

archs:
  - aarch64
  - x86_64

annotations:
  org.opencontainers.image.source: https://codeberg.org/atomdrift/scan
  org.opencontainers.image.title: ascan
  org.opencontainers.image.description: ML-powered malware classification using cleave static analysis
  org.opencontainers.image.licenses: Apache-2.0
