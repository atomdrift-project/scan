[workspace]
# resolver 3 is MSRV-aware: it will not select a dependency version whose
# rust-version exceeds ours, so `cargo update` stays buildable on 1.94.
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
noop_method_call = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
result_unit_err = "deny"
result_large_err = "deny"
missing_safety_doc = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
wildcard_imports = "warn"
string_slice = "warn"
dbg_macro = "deny"
large_futures = "warn"
map_err_ignore = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"

[package]
name = "atomdrift-scan"
version = "2.8.0"
default-run = "atomscan"
edition = "2024"
# Build on any rustc within ~2 releases of current stable. Drives the
# MSRV-aware resolver above; raise deliberately, not by accident.
rust-version = "1.94"
authors = ["The Atomdrift Project"]
description = "ML-powered malware classification using cleave static analysis"
license = "Apache-2.0"
repository = "https://github.com/atomdrift-project/scan"

[dependencies]
# default-features = false drops cleave's `jemalloc` default (its only default
# feature), so cleave doesn't pull in tikv-jemalloc-{ctl,sys}. Litmus declares
# its own #[global_allocator] in main.rs (cfg-gated to skip illumos/Solaris/the
# BSDs that ship jemalloc natively), so we don't need cleave's copy.
# Path dep while the gauntlet startup-cost work is local; flip back to the git
# dep once cleave's changes are pushed. (Direct path dep, not [patch] — cargo
# silently ignores prerelease path patches.)
cleave = { git = "https://github.com/atomdrift-project/cleave.git" }
# fletch finds and fetches the external references cleave surfaces, so scan can
# pull staged payloads and supply-chain dependencies into the same report.
# Path dep while the scoped-npm fix in fletch::purl::normalize is unpushed —
# scan's bloom keys and CLI normalize through it, so `pkg:npm/@scope/name` is
# refused as "not a package URL" against the pushed revision. Flip back to the
# git dep once fletch is pushed and `cargo update -p fletch` picks it up.
fletch = { git = "https://github.com/atomdrift-project/fletch.git" }
proclist = { git = "https://github.com/atomdrift-project/proclist.git" }
# Direct handle on filefacts (already in the graph via cleave/fletch) so the
# `ps` subcommand can tune rizin for low-latency live-process scanning:
# native-arch-only, a tighter timeout, and a size gate on giant binaries.
filefacts = { git = "https://github.com/atomdrift-project/filefacts.git" }
# Direct handle on stng (already in the graph via cleave/filefacts/fletch) so the
# long-lived worker/server modes can reclaim stng's string/r2 caches in-process —
# cleave only prunes them on directory scans, not the per-payload analysis a
# daemon runs. Uses stng's own cache-root helpers, so a relocated
# STNG_STRING_CACHE_DIR is still swept correctly.
stng = { git = "https://github.com/atomdrift-project/stng.git" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Compresses result POST bodies to hopper. Cleave reports are large, highly
# repetitive JSON; zstd cuts them 3-5x on the wire. Already present transitively
# in the lock graph, so this only promotes it to a direct dependency.
zstd = "0.13"
toml = "0.8"
semver = "1"
regex = "1"
anyhow = "1"
dirs = "6.0"
# Pure-Rust ONNX inference (no FFI) — the only model backend. Loads the
# .onnx route models emitted by collimator's training pipeline; tract
# handles the TreeEnsembleClassifier op LightGBM models compile down to
# with onnxmltools.
tract-onnx = { version = "0.21", default-features = false }
tract-linalg = "0.21"
sha2 = "0.10"
# Encodes non-JSON raw registry documents in an upload's provenance sidecar.
# Already present transitively (reqwest/rustls), so this only promotes it to a
# direct dependency.
base64 = "0.22"
terminal-colorsaurus = "0.4"
axum = { version = "0.8", features = ["multipart"] }
# Repeated query keys (?purl=a&purl=b) are a sequence, which serde_urlencoded
# cannot deserialize. Already in the tree via url; taken directly rather than
# hand-rolling percent-decoding for what is a security key.
form_urlencoded = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
tower = { version = "0.5", features = ["limit"] }
# Same terminal-color crate cleave uses, so scan's verdict line and cleave's
# context body gate (tty / NO_COLOR) and color identically.
colored = "3.1"
unicode-width = "0.2"
tempfile = "3"
dashmap = "6"
# Bounded LRU for the GET /_/bloom decision memos. Already in the lock graph
# (via other crates); this only promotes it so we can name the type.
lru = "0.18"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "multipart"], default-features = false }
# Same `Bytes` type reqwest yields, threaded into cleave's zero-copy
# `analyze_bytes_shared` so a downloaded sample is analyzed without a Vec copy.
bytes = "1"
# The Stream trait alone, for the heartbeat body on /v1/analyze. Already in the
# tree via axum; taken directly rather than pulling in all of futures-util for
# one trait we implement ourselves.
futures-core = "0.3"
hostname = "0.4"
rayon = "1"
ctrlc = "3"
# Cheap structural pre-walk to count files before a directory scan, so the
# progress bar has a denominator: cleave streams its own walk and reports the
# total only after it finishes. Already in the lock graph via cleave; this just
# promotes it to a direct dependency.
walkdir = "2.5"

tracing = "0.1"
# Drop the `tracing-log` default feature: that bridge installs a global `log`
# facade that funnels every upstream `log!()` through the tracing dispatcher
# and env-filter. Goblin's ELF note parser warns per malformed note, and on
# pathological inputs that turns into a CPU livelock spending 100% in
# tracing's directive memcmp/TLS lookups. Without the bridge, those calls
# are no-ops at the `log!` macro site.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "smallvec", "std"] }
tar = "0.4.46"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# In-process all-thread backtraces for the SIGUSR1 wedge dump (ptrace-free, so
# it works in FreeBSD jails where lldb/gdb cannot attach).
backtrace = "0.3"

# Use jemalloc on unix systems where it isn't already the system allocator.
# FreeBSD/DragonFlyBSD/NetBSD ship jemalloc as the default (NetBSD's libc
# malloc is jemalloc-derived); bundling a second copy causes TSD assertion
# failures in jails, and on NetBSD tikv-jemalloc-sys's configure script fails
# outright. OpenBSD's jemalloc version string format is incompatible with that
# same configure script. illumos and Solaris ship libumem (a comparable arena
# allocator) and tikv-jemalloc-sys bundles a pre-illumos config.sub that fails
# to recognize the host triple.
#
# Windows: CRT heap showed 12% exclusive plus lock convoy under 16-way
# archive-member analysis (S2pair WPR). mimalloc is the Windows counterpart
# of the jemalloc routing below. Keep in lockstep with `mod mimalloc_alloc`
# in src/main.rs.
[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = "0.1"
tree-sitter = "0.27"

# Keep this list in lockstep with the three cfg blocks in src/main.rs: the
# `#[global_allocator]` static, `mod jemalloc_conf`, and the startup call to
# `route_tree_sitter_through_jemalloc` in `main`.
[target.'cfg(all(unix, not(any(target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd", target_os = "illumos", target_os = "solaris"))))'.dependencies]
tikv-jemallocator = "0.7"
# Already in the graph beneath tikv-jemallocator; named directly only for its
# malloc/calloc/realloc/free declarations, which carry the correct C signatures
# and the `_rjem_` link_name prefix its own build script decides on. Declaring
# them by hand instead would hardcode that prefix and duplicate the signatures.
tikv-jemalloc-sys = "0.7"
# Direct handle on tree-sitter (already in the graph via filefacts) purely to
# call `set_allocator` at startup: tree-sitter's C core otherwise allocates
# through the system malloc, invisible to jemalloc's budgets and — measured
# via vmmap on the gauntlet peak — leaving ~0.8 GB of freed-but-retained
# empty small-zone pages on macOS. Routing it through jemalloc puts parse
# trees under the same decay policies as everything else. The version must
# stay in lockstep with filefacts's; `links = "tree-sitter-language"` makes
# any divergence a loud resolve error rather than a silent dual copy.
tree-sitter = "0.27"

[features]
# Keep the per-member Rayon breadcrumbs compiled into release workers. They are
# dormant unless a wedge is detected, but make the next archive failure
# actionable by naming the exact member running on each Rayon thread.
default = ["cleave-breadcrumbs"]

# Enables jemalloc heap profiling. Build with:
#   cargo build --profile profiling --features jemalloc-prof --bin atomscan
# Run with (note the `_RJEM_` prefix — tikv-jemalloc renames MALLOC_CONF):
#   _RJEM_MALLOC_CONF="prof:true,prof_active:true,prof_final:true,lg_prof_interval:28,prof_prefix:out/heap/jeprof" \
#     ./out/scan.heap worker ...
# Analyze with: jeprof --text ./out/scan.heap out/heap/jeprof.*.heap
jemalloc-prof = ["tikv-jemallocator/profiling"]

# Emit per-member rayon-thread breadcrumbs in the SIGUSR1/wedge dump. Requires a
# cleave build that exposes `cleave::breadcrumb` (the diagnostics PR); off by
# default so the released-cleave build is unaffected. Enable with a matching
# cleave via `[patch]` or a version bump.
cleave-breadcrumbs = []

# Isolate: Windows CRT heap instead of mimalloc (detection A/B).
crt-heap = []

# Thin LTO + cu=16 keeps most of fat LTO's runtime gain at roughly a
# third of the link time — the right default for everyday `cargo build
# --release`. Use the `release-lto` profile for container/distribution
# builds where the extra link minutes are acceptable.
[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 16

# Distribution profile: fat LTO + single codegen unit. Squeezes out the
# last few percent of runtime at the cost of multi-minute link times.
# Used by `make release-lto` and the wolfi container builds.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
strip = "none"
debug = 2

[profile.dev]
debug = "line-tables-only"

# Dependencies at opt-level 1 in dev builds. Two reasons, one of them a hard
# limit: an unoptimized debug binary emits so much DWARF unwind data that
# `__eh_frame` crosses ld64's 16 MiB compact-unwind ceiling and every link
# warns; and `target/debug/atomscan` is what `make lint` and the pre-commit
# hook run fixtures through, so unoptimized dependency code makes those
# measurably slower. The explicit per-package entries below still win over
# this glob.
[profile.dev.package."*"]
opt-level = 1

# Match cleave's dev-profile tuning for the heavy analysis stack. `scan`
# frequently gets profiled and validated from `target/debug`; without these
# overrides, cleave/YARA/regex code runs unoptimized and small fixture scans can
# look tens of seconds slower than the release binary.
[profile.dev.package.cleave]
opt-level = 3

[profile.dev.package.yara-x]
opt-level = 3

[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.serde_yaml]
opt-level = 3

[lints]
workspace = true

[lib]
name = "scan"
path = "src/lib.rs"

# Atomdrift Scan — the product. The crates.io package is `atomdrift-scan` and the
# library is imported as `scan`, but the CLI command is `atomscan`: a unique,
# collision-free name (avast ships its own `/usr/bin/scan`). The product name
# stays "Atomdrift Scan"; only the invocation is `atomscan`.
[[bin]]
name = "atomscan"
path = "src/main.rs"

# Mock hopper for self-contained worker benchmarks (see `make worker-benchmark`).
[[bin]]
name = "scan-bench-hopper"
path = "src/bin/bench_hopper.rs"

# Bloom filter producer: builds known-good/known-bad filters from a labelled
# pool export and writes a publishable bundle (see `make publish-bloom`).
[[bin]]
name = "scan-bloom-build"
path = "src/bin/bloom_build.rs"

[patch.crates-io]
# illumos support for tree-sitter's vendored endian.h. In 0.26.11 the only
# illumos arm tests __illumos__, which illumos-gcc predefines but cross-rs's
# x86_64-unknown-illumos-gcc does not, so the build hits "#error platform not
# supported" at endian.h:238 (see the failed x86_64-unknown-illumos job in CI
# run 30161197323). Upstream added a __sun arm over <sys/byteorder.h> in
# 77cb23fc; __sun is predefined by every compiler targeting illumos or
# Solaris. That fix is unreleased.
#
# Both crates must come from the same source: tree-sitter uses its in-tree
# tree-sitter-language, and `links = "tree-sitter-language"` permits only one
# copy in the graph. Upstream master is 0.27.0 and unpublished — crates.io
# tops out at 0.26.11 — so this patch is load-bearing for resolution, not only
# for the fix, and cleave/filefacts carry an identical block for their own
# standalone builds. Remove all three once a release carries it.
tree-sitter = { git = "https://github.com/tstromberg/tree-sitter", branch = "master" }
tree-sitter-language = { git = "https://github.com/tstromberg/tree-sitter", branch = "master" }


[patch."https://github.com/tstromberg/dmgwiz.git"]
dmgwiz = { git = "https://github.com/atomdrift-project/dmgwiz.git" }
