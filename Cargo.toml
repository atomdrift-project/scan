[package]
name = "litmus"
version = "0.2.0"
edition = "2021"
authors = ["The Atomdrift Project"]
description = "ML-powered malware classification using cleave static analysis"
license = "Apache-2.0"

[dependencies]
cleave = { path = "../cleave" }
proclist = { path = "../proclist" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ort = "2.0.0-rc.12"
sha2 = "0.10"
colored = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[lib]
name = "litmus"
path = "src/lib.rs"

[[bin]]
name = "litmus"
path = "src/main.rs"
