[workspace]
resolver = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
noop_method_call = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
result_unit_err = "deny"
result_large_err = "deny"
missing_safety_doc = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
wildcard_imports = "warn"
string_slice = "warn"
dbg_macro = "deny"
large_futures = "warn"
map_err_ignore = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"

[package]
name = "atomdrift-scan"
version = "2.1.0-rc.1"
default-run = "ascan"
edition = "2024"
authors = ["The Atomdrift Project"]
description = "ML-powered malware classification using cleave static analysis"
license = "Apache-2.0"
repository = "https://codeberg.org/atomdrift/scan"

[dependencies]
# default-features = false drops cleave's `jemalloc` default (its only default
# feature), so cleave doesn't pull in tikv-jemalloc-{ctl,sys}. Litmus declares
# its own #[global_allocator] in main.rs (cfg-gated to skip illumos/Solaris/the
# BSDs that ship jemalloc natively), so we don't need cleave's copy.
cleave = { git = "https://codeberg.org/atomdrift/cleave.git", default-features = false }
# fletch finds and fetches the external references cleave surfaces, so scan can
# pull staged payloads and supply-chain dependencies into the same report.
fletch = { git = "https://codeberg.org/atomdrift/fletch.git" }
proclist = { git = "https://codeberg.org/atomdrift/proclist.git" }
# Direct handle on filefacts (already in the graph via cleave/fletch) so the
# `ps` subcommand can tune rizin for low-latency live-process scanning:
# native-arch-only, a tighter timeout, and a size gate on giant binaries.
filefacts = { git = "https://codeberg.org/atomdrift/filefacts.git" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compresses result POST bodies to hopper. Cleave reports are large, highly
# repetitive JSON; zstd cuts them 3-5x on the wire. Already present transitively
# in the lock graph, so this only promotes it to a direct dependency.
zstd = "0.13"
toml = "0.8"
semver = "1"
regex = "1"
anyhow = "1"
dirs = "6.0"
# Pure-Rust ONNX inference (no FFI) — the only model backend. Loads the
# .onnx route models emitted by collimator's training pipeline; tract
# handles the TreeEnsembleClassifier op LightGBM models compile down to
# with onnxmltools.
tract-onnx = { version = "0.21", default-features = false }
sha2 = "0.10"
terminal-colorsaurus = "0.4"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
tower = { version = "0.5", features = ["limit"] }
# Same terminal-color crate cleave uses, so ascan's verdict line and cleave's
# context body gate (tty / NO_COLOR) and color identically.
colored = "3.1"
tempfile = "3"
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
# Same `Bytes` type reqwest yields, threaded into cleave's zero-copy
# `analyze_bytes_shared` so a downloaded sample is analyzed without a Vec copy.
bytes = "1"
hostname = "0.4"
rayon = "1"
ctrlc = "3"

tracing = "0.1"
# Drop the `tracing-log` default feature: that bridge installs a global `log`
# facade that funnels every upstream `log!()` through the tracing dispatcher
# and env-filter. Goblin's ELF note parser warns per malformed note, and on
# pathological inputs that turns into a CPU livelock spending 100% in
# tracing's directive memcmp/TLS lookups. Without the bridge, those calls
# are no-ops at the `log!` macro site.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "smallvec", "std"] }
tar = "0.4.46"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# In-process all-thread backtraces for the SIGUSR1 wedge dump (ptrace-free, so
# it works in FreeBSD jails where lldb/gdb cannot attach).
backtrace = "0.3"

# Use jemalloc on unix systems where it isn't already the system allocator.
# FreeBSD/DragonFlyBSD ship jemalloc as the default; bundling a second copy
# causes TSD assertion failures in jails. OpenBSD's jemalloc version string
# format is incompatible with tikv-jemalloc-sys's configure script. illumos
# and Solaris ship libumem (a comparable arena allocator) and tikv-jemalloc-sys
# bundles a pre-illumos config.sub that fails to recognize the host triple.
[target.'cfg(all(unix, not(any(target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "illumos", target_os = "solaris"))))'.dependencies]
tikv-jemallocator = "0.6"

[features]
# Enables jemalloc heap profiling. Build with:
#   cargo build --profile profiling --features jemalloc-prof --bin ascan
# Run with (note the `_RJEM_` prefix — tikv-jemalloc renames MALLOC_CONF):
#   _RJEM_MALLOC_CONF="prof:true,prof_active:true,prof_final:true,lg_prof_interval:28,prof_prefix:out/heap/jeprof" \
#     ./out/ascan.heap worker ...
# Analyze with: jeprof --text ./out/ascan.heap out/heap/jeprof.*.heap
jemalloc-prof = ["tikv-jemallocator/profiling"]

# Emit per-member rayon-thread breadcrumbs in the SIGUSR1/wedge dump. Requires a
# cleave build that exposes `cleave::breadcrumb` (the diagnostics PR); off by
# default so the released-cleave build is unaffected. Enable with a matching
# cleave via `[patch]` or a version bump.
cleave-breadcrumbs = []

# Thin LTO + cu=16 keeps most of fat LTO's runtime gain at roughly a
# third of the link time — the right default for everyday `cargo build
# --release`. Use the `release-lto` profile for container/distribution
# builds where the extra link minutes are acceptable.
[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 16

# Distribution profile: fat LTO + single codegen unit. Squeezes out the
# last few percent of runtime at the cost of multi-minute link times.
# Used by `make release-lto` and the wolfi container builds.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
strip = "none"
debug = 2

[lints]
workspace = true

[lib]
name = "scan"
path = "src/lib.rs"

# Atomdrift Scan — the product. The crates.io package is `atomdrift-scan`, but
# the library is imported as `scan` (lib name below); the CLI binary is `ascan`
# (the `a` prefix avoids colliding with avast's /usr/bin/scan).
[[bin]]
name = "ascan"
path = "src/main.rs"

# Mock hopper for self-contained worker benchmarks (see `make worker-benchmark`).
[[bin]]
name = "scan-bench-hopper"
path = "src/bin/bench_hopper.rs"

# FreeBSD/aarch64 support for wasmtime's signal trap handler, pulled in
# transitively via yara-x (cleave -> yara-x -> wasmtime 43.0.2). Upstream
# 43.0.2 lacks the freebsd/aarch64 arm in store_handler_in_ucontext, so the
# build fails with compile_error!("unsupported platform"). Remove once the
# fix lands upstream (bytecodealliance/wasmtime#5499) and yara-x bumps past it.
[patch.crates-io]
wasmtime = { git = "https://github.com/tstromberg/wasmtime.git", branch = "freebsd-aarch64-43.0.2" }

# Local cleave: scan consumes the per-file `filefacts.references` it surfaces
# (FilefactsView) to drive fletch fetching, before that change is published.
# Remove once a cleave release carries it.
# NOTE: cleave intentionally stays on git — local ../cleave is out of sync with
# this scan's API (CompactTrait.src/sources). Only filefacts is patched local,
# for the rizin tuning below; my additions are backward-compatible so git cleave
# consumes the local filefacts fine.
#[patch."https://codeberg.org/atomdrift/cleave.git"]
#cleave = { path = "../cleave" }

# fletch uses `../filefacts` by path; cleave pulls filefacts via git. A built
# crate's own `[patch]` table is ignored when it is a dependency, so the whole
# graph (cleave + fletch) must be steered to ONE filefacts here, or the shared
# `filefacts::ExternalRef` type fails to unify across the two. stng follows for
# the same reason (the local filefacts depends on the unreleased local stng).
#[patch."https://codeberg.org/atomdrift/filefacts.git"]
#filefacts = { path = "../filefacts" }

#[patch."https://codeberg.org/atomdrift/stng.git"]
#stng = { path = "../stng" }



