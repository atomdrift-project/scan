[workspace]
# resolver 3 is MSRV-aware: it will not select a dependency version whose
# rust-version exceeds ours, so `cargo update` stays buildable on 1.94.
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
noop_method_call = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
result_unit_err = "deny"
result_large_err = "deny"
missing_safety_doc = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
wildcard_imports = "warn"
string_slice = "warn"
dbg_macro = "deny"
large_futures = "warn"
map_err_ignore = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"

[package]
name = "atomdrift-scan"
version = "2.4.0"
default-run = "atomscan"
edition = "2024"
# Build on any rustc within ~2 releases of current stable. Drives the
# MSRV-aware resolver above; raise deliberately, not by accident.
rust-version = "1.94"
authors = ["The Atomdrift Project"]
description = "ML-powered malware classification using cleave static analysis"
license = "Apache-2.0"
repository = "https://github.com/atomdrift-project/scan"

[dependencies]
# default-features = false drops cleave's `jemalloc` default (its only default
# feature), so cleave doesn't pull in tikv-jemalloc-{ctl,sys}. Litmus declares
# its own #[global_allocator] in main.rs (cfg-gated to skip illumos/Solaris/the
# BSDs that ship jemalloc natively), so we don't need cleave's copy.
cleave = { git = "https://github.com/atomdrift-project/cleave.git",  default-features = false }
# cleave = { git = "https://github.com/atomdrift-project/cleave.git", default-features = false }
# fletch finds and fetches the external references cleave surfaces, so scan can
# pull staged payloads and supply-chain dependencies into the same report.
# Path dep while fletch::purl::{normalize,identity} is unpushed — scan's bloom
# keys and CLI normalize through it. Flip back to the git dep once fletch is
# pushed and `cargo update -p fletch` picks up the new API.
fletch = { git = "https://github.com/atomdrift-project/fletch.git" }
proclist = { git = "https://github.com/atomdrift-project/proclist.git" }
# Direct handle on filefacts (already in the graph via cleave/fletch) so the
# `ps` subcommand can tune rizin for low-latency live-process scanning:
# native-arch-only, a tighter timeout, and a size gate on giant binaries.
filefacts = { git = "https://github.com/atomdrift-project/filefacts.git" }
# Direct handle on stng (already in the graph via cleave/filefacts/fletch) so the
# long-lived worker/server modes can reclaim stng's string/r2 caches in-process —
# cleave only prunes them on directory scans, not the per-payload analysis a
# daemon runs. Uses stng's own cache-root helpers, so a relocated
# STNG_STRING_CACHE_DIR is still swept correctly.
stng = { git = "https://github.com/atomdrift-project/stng.git" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compresses result POST bodies to hopper. Cleave reports are large, highly
# repetitive JSON; zstd cuts them 3-5x on the wire. Already present transitively
# in the lock graph, so this only promotes it to a direct dependency.
zstd = "0.13"
toml = "0.8"
semver = "1"
regex = "1"
anyhow = "1"
dirs = "6.0"
# Pure-Rust ONNX inference (no FFI) — the only model backend. Loads the
# .onnx route models emitted by collimator's training pipeline; tract
# handles the TreeEnsembleClassifier op LightGBM models compile down to
# with onnxmltools.
tract-onnx = { version = "0.21", default-features = false }
tract-linalg = "0.21"
sha2 = "0.10"
# Encodes non-JSON raw registry documents in an upload's provenance sidecar.
# Already present transitively (reqwest/rustls), so this only promotes it to a
# direct dependency.
base64 = "0.22"
terminal-colorsaurus = "0.4"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
tower = { version = "0.5", features = ["limit"] }
# Same terminal-color crate cleave uses, so scan's verdict line and cleave's
# context body gate (tty / NO_COLOR) and color identically.
colored = "3.1"
tempfile = "3"
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "multipart"], default-features = false }
# Same `Bytes` type reqwest yields, threaded into cleave's zero-copy
# `analyze_bytes_shared` so a downloaded sample is analyzed without a Vec copy.
bytes = "1"
hostname = "0.4"
rayon = "1"
ctrlc = "3"
# Cheap structural pre-walk to count files before a directory scan, so the
# progress bar has a denominator: cleave streams its own walk and reports the
# total only after it finishes. Already in the lock graph via cleave; this just
# promotes it to a direct dependency.
walkdir = "2.5"

tracing = "0.1"
# Drop the `tracing-log` default feature: that bridge installs a global `log`
# facade that funnels every upstream `log!()` through the tracing dispatcher
# and env-filter. Goblin's ELF note parser warns per malformed note, and on
# pathological inputs that turns into a CPU livelock spending 100% in
# tracing's directive memcmp/TLS lookups. Without the bridge, those calls
# are no-ops at the `log!` macro site.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "smallvec", "std"] }
tar = "0.4.46"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# In-process all-thread backtraces for the SIGUSR1 wedge dump (ptrace-free, so
# it works in FreeBSD jails where lldb/gdb cannot attach).
backtrace = "0.3"

# Use jemalloc on unix systems where it isn't already the system allocator.
# FreeBSD/DragonFlyBSD ship jemalloc as the default; bundling a second copy
# causes TSD assertion failures in jails. OpenBSD's jemalloc version string
# format is incompatible with tikv-jemalloc-sys's configure script. illumos
# and Solaris ship libumem (a comparable arena allocator) and tikv-jemalloc-sys
# bundles a pre-illumos config.sub that fails to recognize the host triple.
[target.'cfg(all(unix, not(any(target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "illumos", target_os = "solaris"))))'.dependencies]
tikv-jemallocator = "0.7"

[features]
# Enables jemalloc heap profiling. Build with:
#   cargo build --profile profiling --features jemalloc-prof --bin atomscan
# Run with (note the `_RJEM_` prefix — tikv-jemalloc renames MALLOC_CONF):
#   _RJEM_MALLOC_CONF="prof:true,prof_active:true,prof_final:true,lg_prof_interval:28,prof_prefix:out/heap/jeprof" \
#     ./out/scan.heap worker ...
# Analyze with: jeprof --text ./out/scan.heap out/heap/jeprof.*.heap
jemalloc-prof = ["tikv-jemallocator/profiling"]

# Emit per-member rayon-thread breadcrumbs in the SIGUSR1/wedge dump. Requires a
# cleave build that exposes `cleave::breadcrumb` (the diagnostics PR); off by
# default so the released-cleave build is unaffected. Enable with a matching
# cleave via `[patch]` or a version bump.
cleave-breadcrumbs = []

# Thin LTO + cu=16 keeps most of fat LTO's runtime gain at roughly a
# third of the link time — the right default for everyday `cargo build
# --release`. Use the `release-lto` profile for container/distribution
# builds where the extra link minutes are acceptable.
[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 16

# Distribution profile: fat LTO + single codegen unit. Squeezes out the
# last few percent of runtime at the cost of multi-minute link times.
# Used by `make release-lto` and the wolfi container builds.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
strip = "none"
debug = 2

[profile.dev]
debug = "line-tables-only"

# Match cleave's dev-profile tuning for the heavy analysis stack. `scan`
# frequently gets profiled and validated from `target/debug`; without these
# overrides, cleave/YARA/regex code runs unoptimized and small fixture scans can
# look tens of seconds slower than the release binary.
[profile.dev.package.cleave]
opt-level = 3

[profile.dev.package.yara-x]
opt-level = 3

[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.serde_yaml]
opt-level = 3

[lints]
workspace = true

[lib]
name = "scan"
path = "src/lib.rs"

# Atomdrift Scan — the product. The crates.io package is `atomdrift-scan` and the
# library is imported as `scan`, but the CLI command is `atomscan`: a unique,
# collision-free name (avast ships its own `/usr/bin/scan`). The product name
# stays "Atomdrift Scan"; only the invocation is `atomscan`.
[[bin]]
name = "atomscan"
path = "src/main.rs"

# Mock hopper for self-contained worker benchmarks (see `make worker-benchmark`).
[[bin]]
name = "scan-bench-hopper"
path = "src/bin/bench_hopper.rs"

# Bloom filter producer: builds known-good/known-bad filters from a labelled
# pool export and writes a publishable bundle (see `make publish-bloom`).
[[bin]]
name = "scan-bloom-build"
path = "src/bin/bloom_build.rs"

# FreeBSD/aarch64 support for wasmtime's signal trap handler, pulled in
# transitively via yara-x (cleave -> yara-x -> wasmtime 43.0.2). Upstream
# 43.0.2 lacks the freebsd/aarch64 arm in store_handler_in_ucontext, so the
# build fails with compile_error!("unsupported platform"). Remove once the
# fix lands upstream (bytecodealliance/wasmtime#5499) and yara-x bumps past it.
[patch.crates-io]
wasmtime = { git = "https://github.com/tstromberg/wasmtime.git", branch = "freebsd-aarch64-43.0.2" }

# Cleave still names the former Codeberg remotes, while Scan and Fletch consume
# the GitHub remotes. Patch those source identities to the same current crates
# so report facts have one concrete type throughout the dependency graph.
[patch."https://codeberg.org/atomdrift/filefacts.git"]
filefacts = { git = "https://github.com/atomdrift-project/filefacts.git" }

[patch."https://codeberg.org/atomdrift/stng.git"]
stng = { git = "https://github.com/atomdrift-project/stng.git" }

[patch."https://github.com/tstromberg/dmgwiz.git"]
dmgwiz = { git = "https://github.com/atomdrift-project/dmgwiz.git" }

# TEMPORARY local fletch: gives a pinned version on an immutable registry
# (crates.io / Go proxy / Maven Central) a 90-day metadata TTL instead of 4h.
# The 4h tier exists to catch a post-publish mutation those registries forbid, so
# on a lockfile-heavy scan it re-fetches hundreds of packuments that cannot have
# changed. NOTE: ../fletch is one commit ("update deps") BEHIND the rev scan
# locks, so this build's dependency graph differs slightly from the locked one —
# fine for measurement, rebase before merging. Remove and bump the fletch rev
# once a release carries the change.

# TEMPORARY local cleave: archive-mode aggregation cost. `make bench-archive`
# measures it and `make profile-archive` shows where it goes — both need cleave
# rebuilt in the loop, so scan has to see ../cleave rather than the git rev.
# ../cleave HEAD is exactly the rev scan locks (37d50ed2), so with no local edits
# this builds identical code and the filefacts/stng revs still unify. Remove and
# bump the git rev once cleave carries the change. Keyed by the git URL, not
# crates-io: cleave is a git dependency, and a crates-io patch is silently
# unused against a git source ("patch ... was not used in the crate graph").

# TEMPORARY local cleave: carries the tiny-format trait-id annotation
# (`# SEV LOC desc (id)`, so an LLM reading tiny output can name and locate the
# trait that fired). ../cleave is at the exact rev scan locks (380629512b70) plus
# that single additive output.rs change, so the filefacts/stng revs still unify.
# Remove and bump the cleave git rev once a cleave release carries the annotation.

# Local cleave: adds `cleave::scan_paths`, which analyzes a caller-supplied file
# list under the same filtered pipeline as `scan_directory`. scan does its own
# `walkdir` pass to learn the file count upfront (for the progress bar + ETA) and
# hands the list to cleave, so the tree is walked once instead of twice. ../cleave
# is the rev scan locks to plus this additive change; its filefacts/stng revs
# match scan's, so the shared types unify. Revert to the git rev once a cleave
# release carries scan_paths.

# Local cleave: scan consumes the per-file `filefacts.references` it surfaces
# (FilefactsView) to drive fletch fetching, before that change is published.
# Remove once a cleave release carries it.
# NOTE: cleave intentionally stays on git. Use a temporary local patch while
# profiling cross-repo changes, then update the git revision once cleave carries
# the change.
# Local cleave: adds AnalysisOptions::skip_predicate (the per-file known-good/bad
# bloom short-circuit hook) and widens its signature to `Fn(&str, &Path)` so the
# predicate can consult filesystem metadata — a known-good file is skipped only
# while it is unchanged, so a freshly-touched one is analyzed once on its own
# merits instead of being skipped then re-analyzed. ../cleave is at the same rev
# scan locks to, plus this additive change. Remove this patch and bump the git
# rev once a cleave release carries it.

# Local filefacts + fletch: scan drives fetching off the package.json
# dependencies filefacts now emits and fletch's registry resolution of an
# unversioned npm PURL to the current release, before either change is
# published. A built crate's own `[patch]` table is ignored when it is a
# dependency, so the whole graph (cleave + fletch) must be steered to ONE
# filefacts here, or the shared `filefacts::ExternalRef` type fails to unify
# across the two. stng follows for the same reason (the local filefacts depends
# on the unreleased local stng). cleave stays on git — local ../cleave is out of
# sync with this scan's API; my filefacts additions are backward-compatible, so
# git cleave consumes the local filefacts fine. Remove once releases carry these.

# Local fletch: adds `fetch::fetch_references_with`, the per-completion callback
# the interactive dependency tree (`scan::deptree`) drives — each fetch flips its
# row from "fetching" to "analyzing" the moment it lands, instead of the whole
# batch flipping at once when `fetch_references` returns. ../fletch is the rev
# scan locks to plus this additive change (and the already-merged url_to_purl);
# its filefacts rev matches scan's, so the shared `ExternalRef`/`Reference` type
# unifies. Remove this patch and bump the git rev once a fletch release carries
# `fetch_references_with`.

# Local stng: carries the additive `cache_sweep` module (background cache
# reclamation) that scan's daemon modes drive. ../stng is the exact rev scan
# locks (7a0d0e3b) plus that additive change, so cleave/fletch/filefacts still
# unify on it. Remove and bump the git rev once an stng release carries it.

# TEMPORARY: local cleave for traits-walk I/O profiling + fix. ../cleave HEAD is
# one docs-only commit ahead of the pinned rev 38062951 (source-identical), so
# this builds the same code plus the cache.rs walk-once/logging changes. Remove
# and bump the git rev once cleave carries them.

# Local fletch: `selected()` now fetches a declared dependency / commanded
# package expressed as a raw URL (a PKGBUILD `source=()`) under the deps/packages
# policy, instead of gating every URL locator behind the `urls` flag — a
# URL-locator dependency was announced + marked "fetching" by scan's kind-based
# selection but silently dropped by fletch's locator-based one, orphaning the row.
# ../fletch is at the rev scan locks to plus this additive change; its filefacts
# rev (37942aa) matches scan's, so the shared `Reference`/`RefKind` types unify.
# Remove this patch and bump the git rev once a fletch release carries it.

# TEMPORARY local cleave: the tiny/LLM view's low-tier fill
# (`TinyOpts::low_tier_fill`) — a top-scored file always shows its top-15 traits,
# topping up with component/baseline when little or nothing notable fired, so a
# benign binary still renders its functionality for the LLM instead of an empty
# payload (which `--interpret` could never grade, and a mis-pooled file could
# never recover from). ../cleave is the pinned rev (8ba8b60c) plus this change.
# Remove and bump the git rev once cleave carries it.

# TEMPORARY verify: local cleave for the 96-byte ASCII-context widening.
