[package]
name = "litmus"
version = "0.2.0"
edition = "2021"
authors = ["The Atomdrift Project"]
description = "ML-powered malware classification using cleave static analysis"
license = "Apache-2.0"

[dependencies]
cleave = { git = "ssh://git@codeberg.org/atomdrift/cleave.git" }
proclist = { git = "ssh://git@codeberg.org/atomdrift/proclist.git" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6.0"
ort = "2.0.0-rc.12"
sha2 = "0.10"
colored = "2"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["limit"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]

[lib]
name = "litmus"
path = "src/lib.rs"

[[bin]]
name = "litmus"
path = "src/main.rs"
