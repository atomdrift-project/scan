[package]
name = "litmus"
version = "0.1.0"
edition = "2021"
authors = ["Chainguard Inc."]
description = "ML-powered malware classification using cleave static analysis"
license = "Apache-2.0"

[dependencies]
# Local dependency for static analysis
cleave = { path = "../cleave" }

# ONNX Runtime for ML inference (optional)
# ort = { version = "2.0.0-rc.11", features = ["load-dynamic"] }
# ndarray = "0.16"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
thiserror = "1"
dirs = "5"
colored = "2"
rayon = "1"
rand = "0.9"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lib]
name = "litmus"
path = "src/lib.rs"

[[bin]]
name = "litmus"
path = "src/main.rs"
