# Smoke-test published release binaries on distributions that share a Rust
# target ABI. These are runtime compatibility checks, not additional release
# artifacts: OpenIndiana and Tribblix use x86_64-unknown-illumos, while
# GhostBSD and (when compatible) MidnightBSD consume x86_64-unknown-freebsd.

name: platform compatibility

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published v* release tag to test.
        type: string
        required: true
        default: v2.5.0
      platform:
        description: Run all probes or retry one platform.
        type: choice
        default: all
        options:
          - all
          - openindiana
          - tribblix
          - ghostbsd
          - midnightbsd
          - openeuler
          - blissos

permissions: {}

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.tag }}

jobs:
  openindiana:
    name: OpenIndiana 202604 / x86_64-unknown-illumos
    if: ${{ inputs.platform == 'all' || inputs.platform == 'openindiana' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download illumos release binary
        run: |
          set -eu
          case "$TAG" in v*) ;; *) echo "::error::tag must start with v"; exit 1;; esac
          version="${TAG#v}"
          mkdir -p compat
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "atomscan-$version-x86_64-unknown-illumos.tar.gz" \
            --dir compat

      - name: Smoke test on OpenIndiana
        uses: vmactions/openindiana-vm@52f16d4534fe3edd9d9621621c238398d4d2a698 # v1.1.5
        with:
          release: "202604"
          usesh: true
          # The minimal VM omits GCC's shared runtimes, while cross-rs's
          # illumos image links libgcc_s and libstdc++ dynamically. Install the
          # default-runtime compatibility links a normal OI development host
          # receives with GCC.
          prepare: |
            pkg install \
              system/library/gcc-10-runtime \
              system/library/g++-10-runtime \
              system/library/gcc-10-compat-links
          run: |
            set -eux
            cd compat
            gzip -dc atomscan-*-x86_64-unknown-illumos.tar.gz | tar xf -
            chmod +x atomscan
            ./atomscan --version
            ./atomscan --help >/dev/null

  tribblix:
    name: Tribblix 0m40 / x86_64-unknown-illumos
    if: ${{ inputs.platform == 'all' || inputs.platform == 'tribblix' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download illumos release binary
        run: |
          set -eu
          case "$TAG" in v*) ;; *) echo "::error::tag must start with v"; exit 1;; esac
          version="${TAG#v}"
          mkdir -p compat
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "atomscan-$version-x86_64-unknown-illumos.tar.gz" \
            --dir compat

      - name: Smoke test on Tribblix
        uses: vmactions/tribblix-vm@4a486df18403c7ceeeab5fcb82fa47ff2116d35a # v1.0.3
        with:
          release: "0m40"
          usesh: true
          run: |
            set -eux
            cd compat
            gzip -dc atomscan-*-x86_64-unknown-illumos.tar.gz | tar xf -
            chmod +x atomscan
            ./atomscan --version
            ./atomscan --help >/dev/null

  ghostbsd:
    name: GhostBSD 26.1 / x86_64-unknown-freebsd
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ghostbsd' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download FreeBSD release binary
        run: |
          set -eu
          case "$TAG" in v*) ;; *) echo "::error::tag must start with v"; exit 1;; esac
          version="${TAG#v}"
          mkdir -p compat
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "atomscan-$version-x86_64-unknown-freebsd.tar.gz" \
            --dir compat

      - name: Smoke test on GhostBSD
        uses: vmactions/ghostbsd-vm@5ed1dcce064c887d3767fc00ac0176a51fdd4e74 # v1.0.2
        with:
          release: "26.1"
          usesh: true
          run: |
            set -eux
            tar -xzf compat/atomscan-*-x86_64-unknown-freebsd.tar.gz -C compat
            chmod +x compat/atomscan
            compat/atomscan --version
            compat/atomscan --help >/dev/null

  midnightbsd:
    name: MidnightBSD 4.0.7 / FreeBSD ABI probe
    if: ${{ inputs.platform == 'all' || inputs.platform == 'midnightbsd' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download FreeBSD release binary
        run: |
          set -eu
          case "$TAG" in v*) ;; *) echo "::error::tag must start with v"; exit 1;; esac
          version="${TAG#v}"
          mkdir -p compat
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "atomscan-$version-x86_64-unknown-freebsd.tar.gz" \
            --dir compat

      # Rust has no MidnightBSD target. This explicitly tests whether the
      # FreeBSD artifact is ABI-compatible instead of claiming support based
      # only on the distribution's ancestry.
      - name: Probe FreeBSD binary on MidnightBSD
        # v1.0.4 advertises 4.0.7, but its immutable tag omitted that config.
        # Pin the first post-release commit that actually contains it.
        uses: vmactions/midnightbsd-vm@814d16b629666e7eddcc2a0f834ac9d34cc596a5 # post-v1.0.4
        with:
          release: "4.0.7"
          usesh: true
          run: |
            set -eux
            tar -xzf compat/atomscan-*-x86_64-unknown-freebsd.tar.gz -C compat
            chmod +x compat/atomscan
            compat/atomscan --version
            compat/atomscan --help >/dev/null

  openeuler:
    name: openEuler 25.09 / x86_64-unknown-linux-gnu
    if: ${{ inputs.platform == 'all' || inputs.platform == 'openeuler' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download Linux GNU release binary
        run: |
          set -eu
          case "$TAG" in v*) ;; *) echo "::error::tag must start with v"; exit 1;; esac
          version="${TAG#v}"
          mkdir -p compat
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "atomscan-$version-x86_64-unknown-linux-gnu.tar.gz" \
            --dir compat

      - name: Smoke test on openEuler
        uses: vmactions/openeuler-vm@694e5d6637c08e6ed139a0403bae8041d5651e20 # v1.0.0
        with:
          release: "25.09"
          usesh: true
          run: |
            set -eux
            tar -xzf compat/atomscan-*-x86_64-unknown-linux-gnu.tar.gz -C compat
            chmod +x compat/atomscan
            compat/atomscan --version
            compat/atomscan --help >/dev/null

  blissos:
    name: BlissOS 16 / x86_64-unknown-linux-musl reuse probe
    if: ${{ inputs.platform == 'all' || inputs.platform == 'blissos' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download and unpack static Linux binary
        run: |
          set -eu
          case "$TAG" in v*) ;; *) echo "::error::tag must start with v"; exit 1;; esac
          version="${TAG#v}"
          mkdir -p compat
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "atomscan-$version-x86_64-unknown-linux-musl.tar.gz" \
            --dir compat
          tar -xzf compat/atomscan-*-x86_64-unknown-linux-musl.tar.gz -C compat
          chmod +x compat/atomscan

      # Android uses bionic, so the glibc artifact cannot work here. The musl
      # artifact is static and only asks BlissOS for a compatible Linux kernel
      # and permission to execute files copied into the VM.
      - name: Probe static musl binary on BlissOS
        uses: vmactions/blissos-vm@aa5109850186555568e720ca897237440645ef10 # v1.0.1
        with:
          release: "16"
          sync: scp
          usesh: true
          run: |
            set -eux
            compat/atomscan --version
            compat/atomscan --help >/dev/null
