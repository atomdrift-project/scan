name: sigstore smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  sign-and-verify:
    name: keyless blob signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify probe
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sigstore-smoke.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/atomdrift-sigstore-probe.txt"
          bundle="$RUNNER_TEMP/atomdrift-sigstore-probe.sigstore.json"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
          } > "$probe"

          cosign version
          cosign sign-blob --yes --bundle "$bundle" "$probe"
          cosign verify-blob "$probe" \
            --bundle "$bundle" \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          {
            echo "### Sigstore smoke test"
            echo
            echo "- Identity: \`$EXPECTED_IDENTITY\`"
            echo "- Issuer: \`https://token.actions.githubusercontent.com\`"
            echo "- Result: keyless signature verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification material
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigstore-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/atomdrift-sigstore-probe.txt
            ${{ runner.temp }}/atomdrift-sigstore-probe.sigstore.json
          if-no-files-found: error
          retention-days: 7
