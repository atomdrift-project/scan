# Reusable build matrix — the single definition of "what platforms we ship and
# how". Called by ci.yml (thin LTO, ad-hoc macOS signature) and by release.yml
# (fat LTO, plus whatever signing the `sign`/`notarize` inputs ask for). Keeping
# one matrix means CI and release can't drift into building different things.
#
# See ci.yml for the hardening rationale that applies to both callers.

name: build

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to check out. Empty uses the caller's commit; release recovery
          can supply an existing tag while using the repaired workflow from the
          default branch.
        type: string
        default: ""
      target:
        description: >-
          Build only this target during a release recovery. Empty builds the
          complete matrix. Matrix-backed targets run their whole matrix group.
        type: string
        default: ""
      profile:
        description: >-
          Cargo profile: `release` (thin LTO, everyday CI) or `release-lto`
          (fat LTO + one codegen unit, distribution builds).
        type: string
        default: release
      sign:
        description: >-
          Sign the macOS binaries with the Developer ID identity. Requires the
          MACOS_CERT_* secrets; falls back to an ad-hoc signature when false.
        type: boolean
        default: false
      notarize:
        description: >-
          Submit the signed binaries to Apple's notary service. Implies `sign`
          and needs the MACOS_NOTARY_* secrets. Off by default: notarization is
          the slowest and most failure-prone step here, and an unnotarized
          build is still perfectly runnable locally — it only costs a Gatekeeper
          prompt on machines that downloaded it.
        type: boolean
        default: false
      require-notarization:
        description: >-
          Require Apple to finish processing before the job succeeds. Release
          publication sets this; dry runs merely prove that Apple accepted the
          upload so a notary-service backlog does not fail unrelated CI.
        type: boolean
        default: false
    secrets:
      MACOS_CERT_P12:
        description: Base64-encoded .p12 holding the Developer ID Application cert + key.
        required: false
      MACOS_CERT_PASSWORD:
        description: Password the .p12 was exported with.
        required: false
      MACOS_NOTARY_KEY:
        description: Base64-encoded App Store Connect API key (.p8).
        required: false
      MACOS_NOTARY_KEY_ID:
        description: App Store Connect key ID.
        required: false
      MACOS_NOTARY_ISSUER:
        description: App Store Connect issuer UUID.
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CROSS_REV: 55f847251389c5406df85579191c0eac412fab3a
  RUST_BACKTRACE: "1"
  SCAN_NO_UPDATE: "1"

jobs:
  native:
    name: ${{ matrix.target }}
    if: ${{ inputs.target == '' || contains(' x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin ', format(' {0} ', inputs.target)) }}
    runs-on: ${{ matrix.os }}
    # A publishing release may spend up to four hours waiting for Apple's
    # asynchronous notary service after the build. Keep the ordinary CI/dry-run
    # ceiling at 150m; those wait only 10m for notarization.
    timeout-minutes: ${{ inputs.require-notarization && 330 || 150 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc floor comes from the runner: 22.04 is glibc 2.35. Bumping to
          # ubuntu-24.04 raises it to 2.39 and silently drops older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
            test: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            native: true

          - target: aarch64-apple-darwin
            os: macos-26
            native: true
            test: true

          # Cross-built on the arm64 runner: the macOS SDK carries both slices,
          # and GitHub is retiring the Intel runners. Build-only — Rosetta is
          # not guaranteed on the arm64 image, so we can't smoke it here.
          - target: x86_64-apple-darwin
            os: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      # 708 crates, a ~139 MB binary, and several C deps: the stock runner
      # image leaves ~25 GB free on / and this build will use a good chunk.
      - name: Reclaim runner disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          rustc --version --verbose

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Registry + git checkouts only, never target/. The five git deps are
          # large and re-cloned on every miss; target/ dirs for this graph run
          # to tens of GB and would blow the 10 GB per-repo cache budget.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-${{ matrix.target }}-

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: cargo build --locked --profile "$PROFILE" --target "$TARGET" --bin atomscan

      # `--lib` only, mirroring `make test-unit`. The integration tests in
      # tests/ each link their own copy of a very large binary; enabling them
      # here needs a look at wall-clock and disk first. The model-dependent
      # tests are already #[ignore]d.
      - name: Test
        if: matrix.test
        run: cargo test --locked --lib

      # --- macOS signing ------------------------------------------------------
      # Unsigned path: an ad-hoc signature, matching what `make release` does on
      # Darwin. Good enough for CI artifacts, useless for distribution.
      - name: Ad-hoc codesign
        if: ${{ runner.os == 'macOS' && !inputs.sign }}
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: codesign --force --sign - "target/$TARGET/$PROFILE/atomscan"

      # Signed path: import the Developer ID cert into a throwaway keychain
      # that exists only for this job. Never touch the runner's login keychain,
      # and never leave the .p12 on disk.
      - name: Import Developer ID certificate
        if: ${{ runner.os == 'macOS' && inputs.sign }}
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          # Fail with something readable instead of letting `security import`
          # choke on a zero-byte .p12, which is what an unset secret produces.
          if [ -z "$CERT_P12" ]; then
            echo "::error::sign=true but MACOS_CERT_P12 is not set - configure the signing secrets or call this workflow with sign=false"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/atomdrift-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          INTERMEDIATE_G1="$RUNNER_TEMP/DeveloperIDCA-G1.cer"
          INTERMEDIATE_G2="$RUNNER_TEMP/DeveloperIDCA-G2.cer"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ORIGINAL_DEFAULT_KEYCHAIN="$(security default-keychain -d user | \
            sed -e 's/^[[:space:]\"]*//' -e 's/[[:space:]\"]*$//')"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"
          security default-keychain -d user -s "$KEYCHAIN"

          # Import both Apple Developer ID intermediates so certificate
          # rotation between the legacy G1 and current G2 chains is painless.
          # Pin the exact DER bytes because these files affect release trust.
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            --output "$INTERMEDIATE_G1"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$INTERMEDIATE_G2"
          INTERMEDIATE_G1_SHA="$(shasum -a 256 "$INTERMEDIATE_G1" | awk '{print $1}')"
          INTERMEDIATE_G2_SHA="$(shasum -a 256 "$INTERMEDIATE_G2" | awk '{print $1}')"
          if [ "$INTERMEDIATE_G1_SHA" != 7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f ]; then
            echo "::error::Apple Developer ID G1 intermediate checksum mismatch"
            exit 1
          fi
          if [ "$INTERMEDIATE_G2_SHA" != f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a ]; then
            echo "::error::Apple Developer ID G2 intermediate checksum mismatch"
            exit 1
          fi
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Derive the selector before adding the intermediate: the exported
          # .p12 contains one leaf identity, so its certificate fingerprint is
          # unambiguous and does not depend on Keychain common-name indexing.
          SIGNING_IDENTITY="$(security find-certificate -a -Z "$KEYCHAIN" | \
            awk '/SHA-1 hash:/ { print $3 }')"
          IDENTITY_COUNT="$(printf '%s\n' "$SIGNING_IDENTITY" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "$IDENTITY_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one certificate in MACOS_CERT_P12; found $IDENTITY_COUNT"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

          security import "$INTERMEDIATE_G1" -k "$KEYCHAIN"
          security import "$INTERMEDIATE_G2" -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12" "$INTERMEDIATE_G1" "$INTERMEDIATE_G2"

          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend ours to the existing user keychain list. The word splitting
          # is deliberate — each existing keychain has to land as its own
          # argument — and the paths come from `security` itself, not us.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN" || true
      # Hardened runtime is mandatory for notarization, and hardened runtime
      # blocks JIT by default — which would kill us, because yara-x runs its
      # compiled rules through wasmtime/cranelift at load time. Hence the
      # allow-jit entitlement in .github/macos-entitlements.plist.
      - name: Sign with Developer ID
        if: ${{ runner.os == 'macOS' && inputs.sign }}
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -eu
          BIN="target/$TARGET/$PROFILE/atomscan"
          codesign --force --timestamp --options runtime \
            --entitlements .github/macos-entitlements.plist \
            --sign "$SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign --display --entitlements - "$BIN"

      - name: Notarize
        if: ${{ runner.os == 'macOS' && inputs.sign && inputs.notarize }}
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          REQUIRE_NOTARIZATION: ${{ inputs.require-notarization }}
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          BIN="target/$TARGET/$PROFILE/atomscan"
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "::error::notarize=true but one or more MACOS_NOTARY_* secrets are unset"
            exit 1
          fi

          NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8"
          NOTARY_ARCHIVE="$RUNNER_TEMP/atomscan.zip"
          SUBMIT_RESULT="$RUNNER_TEMP/notary-submit.json"
          STATUS_RESULT="$RUNNER_TEMP/notary-status.json"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$NOTARY_KEY_FILE"
          /usr/bin/ditto -c -k "$BIN" "$NOTARY_ARCHIVE"

          # Submission and processing are separate operations. Keep the UUID
          # so a dropped connection while polling cannot force a second upload.
          submit_attempt=1
          until xcrun notarytool submit "$NOTARY_ARCHIVE" \
            --key "$NOTARY_KEY_FILE" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" \
            --no-wait --output-format json > "$SUBMIT_RESULT"; do
            if [ "$submit_attempt" -ge 3 ]; then
              echo "::error::Apple notarization upload failed after $submit_attempt attempts"
              exit 1
            fi
            echo "::warning::Notarization upload attempt $submit_attempt failed; retrying"
            sleep $((submit_attempt * 30))
            submit_attempt=$((submit_attempt + 1))
          done

          SUBMISSION_ID="$(plutil -extract id raw -o - "$SUBMIT_RESULT")"
          echo "Apple notarization submission: $SUBMISSION_ID"
          {
            echo "### macOS notarization"
            echo
            echo "- Target: \`$TARGET\`"
            echo "- Submission: \`$SUBMISSION_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$REQUIRE_NOTARIZATION" = true ]; then
            wait_timeout=20m
            max_attempts=12
          else
            wait_timeout=10m
            max_attempts=1
          fi

          wait_attempt=1
          while :; do
            rm -f "$STATUS_RESULT"
            wait_rc=0
            xcrun notarytool wait "$SUBMISSION_ID" \
              --key "$NOTARY_KEY_FILE" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER" \
              --timeout "$wait_timeout" \
              --output-format json > "$STATUS_RESULT" || wait_rc=$?

            # A timeout or transient App Store Connect error does not cancel
            # the server-side submission. Query that same UUID before deciding
            # whether to retry or fail.
            if [ "$wait_rc" -ne 0 ]; then
              echo "::warning::Notary wait exited $wait_rc; querying submission $SUBMISSION_ID"
              info_attempt=1
              while ! xcrun notarytool info "$SUBMISSION_ID" \
                --key "$NOTARY_KEY_FILE" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER" \
                --output-format json > "$STATUS_RESULT"; do
                if [ "$info_attempt" -ge 3 ]; then
                  rm -f "$STATUS_RESULT"
                  break
                fi
                sleep $((info_attempt * 15))
                info_attempt=$((info_attempt + 1))
              done
            fi

            status=""
            if [ -s "$STATUS_RESULT" ]; then
              status="$(plutil -extract status raw -o - "$STATUS_RESULT" 2>/dev/null || true)"
            fi
            echo "Notarization status: ${status:-unavailable}"

            case "$status" in
              Accepted)
                echo "- Status: Accepted" >> "$GITHUB_STEP_SUMMARY"
                break
                ;;
              Invalid|Rejected)
                echo "- Status: $status" >> "$GITHUB_STEP_SUMMARY"
                xcrun notarytool log "$SUBMISSION_ID" \
                  --key "$NOTARY_KEY_FILE" \
                  --key-id "$NOTARY_KEY_ID" \
                  --issuer "$NOTARY_ISSUER" || true
                echo "::error::Apple rejected notarization submission $SUBMISSION_ID"
                exit 1
                ;;
              "In Progress"|"") ;;
              *)
                echo "::warning::Unexpected notarization status: $status"
                ;;
            esac

            if [ "$wait_attempt" -ge "$max_attempts" ]; then
              if [ "$REQUIRE_NOTARIZATION" = true ]; then
                echo "- Status: ${status:-Unavailable} (timed out)" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::Notarization submission $SUBMISSION_ID did not finish within the release wait window"
                exit 1
              fi
              echo "- Status: ${status:-Unavailable} (processing continues at Apple)" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Apple accepted submission $SUBMISSION_ID but has not finished processing it; this dry run will continue"
              break
            fi
            wait_attempt=$((wait_attempt + 1))
          done

          rm -f "$NOTARY_KEY_FILE" "$NOTARY_ARCHIVE" "$SUBMIT_RESULT" "$STATUS_RESULT"
          # A bare Mach-O can't be stapled — `stapler` only handles bundles,
          # .dmg and .pkg — so Gatekeeper resolves the ticket online the first
          # time a downloaded copy runs. Ship a signed .pkg if you ever need
          # offline-verifiable direct downloads.

      - name: Remove signing keychain
        if: ${{ always() && runner.os == 'macOS' && inputs.sign }}
        run: |
          set -eu
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/cert.p12" \
            "$RUNNER_TEMP/DeveloperIDCA-G1.cer" \
            "$RUNNER_TEMP/DeveloperIDCA-G2.cer" \
            "$RUNNER_TEMP/notary.p8" \
            "$RUNNER_TEMP/atomscan.zip" \
            "$RUNNER_TEMP/notary-submit.json" \
            "$RUNNER_TEMP/notary-status.json"
      # ------------------------------------------------------------------------

      - name: Smoke test
        if: matrix.native
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          file "target/$TARGET/$PROFILE/atomscan"
          "./target/$TARGET/$PROFILE/atomscan" --version
          "./target/$TARGET/$PROFILE/atomscan" --help >/dev/null

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: tar -czf "atomscan-$TARGET.tar.gz" -C "target/$TARGET/$PROFILE" atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-${{ matrix.target }}
          path: atomscan-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Native build in a KVM-accelerated VM, which is the only way to actually run
  # the test suite on FreeBSD. Uses the OS's packaged rust, so it also tells us
  # when ports rust drifts below our MSRV.
  # aarch64-unknown-freebsd was tried here on ubuntu-24.04-arm and removed:
  # that image does not give the guest KVM, so qemu falls back to TCG. The
  # x86_64 build takes ~46 min accelerated; emulated, the arm64 one was still
  # compiling at 2h16m against the 150 min cap. Don't re-add it without a host
  # that can actually accelerate an aarch64 guest — raising the timeout just
  # buys a 4-6 hour job for one target.
  freebsd:
    name: x86_64-unknown-freebsd
    if: ${{ inputs.target == '' || inputs.target == 'x86_64-unknown-freebsd' }}
    # Host image is only the VM host here — the compile happens inside the
    # guest against FreeBSD's libc — so the glibc-floor reasoning that pins
    # `native` to 22.04 does not apply. Newer host, newer KVM stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          usesh: true
          # Newest stable image the builder publishes, pinned explicitly rather than
          # left to the action's default, since an image that changes under us
          # is an unreviewed dependency.
          #
          # Tradeoff: this was 14.3 so the artifact stayed runnable on 14.x as
          # well as 15.x — FreeBSD binaries run forward across majors, not
          # backward. Building on 15.1 means 15.x only. Drop back to 14.4 if
          # 14.x reach matters more than a current ports rust (which is also
          # what keeps this job's MSRV headroom).
          release: "15.1"
          # Runner is 4 vCPU / 16 GB; leave the host a couple of GB. The link
          # step for a binary this size is the memory high-water mark.
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          # cmake is for aws-lc-sys, which has no prebuilt path off the tier-1
          # platforms and falls back to a CMake build.
          prepare: |
            pkg install -y rust cmake pkgconf git
          run: |
            set -eux
            rustc --version
            # Keep target/ out of the synced workspace: the action rsyncs the
            # workspace back to the host at the end, and a full target/ is tens
            # of GB. Only the finished binary gets copied in.
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "/tmp/target/$BUILD_PROFILE/atomscan" --version
            cp "/tmp/target/$BUILD_PROFILE/atomscan" ./atomscan
            # Non-fatal during bring-up: this is the first time the suite has
            # run on FreeBSD in CI, and we want the artifact either way. Make
            # it fatal once we know it's green.
            cargo test --locked --lib || echo "::warning::FreeBSD unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-freebsd.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-freebsd
          path: atomscan-x86_64-unknown-freebsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Same VM pattern as freebsd, and src/ is already OpenBSD-aware: lib.rs,
  # main.rs, thread_dump.rs and server/handlers.rs all carry openbsd arms, and
  # the jemalloc exclusion in Cargo.toml documents OpenBSD's version-string
  # format breaking tikv-jemalloc-sys's configure.
  #
  # The open question is not whether it builds, it is whether it *runs*.
  # OpenBSD kills processes that map W|X pages outside a `wxallowed` mount, and
  # yara-x compiles its rules to WebAssembly and JITs them through
  # wasmtime/cranelift — the same JIT that forced the allow-jit entitlement on
  # macOS. Rules are only compiled on an actual scan, so `--version` proves
  # nothing here; the unit tests below are what would surface it.
  openbsd:
    name: x86_64-unknown-openbsd
    if: ${{ inputs.target == '' || inputs.target == 'x86_64-unknown-openbsd' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@c941015845c0f0c429676840963dc63b226d4f69 # v1.4.5
        with:
          usesh: true
          # Newest image available. OpenBSD makes no cross-release ABI promise,
          # so there is no reach argument for staying back — the artifact is
          # effectively single-release either way, and this pin needs bumping
          # every six months. 7.8's ports rust was 1.90, below this crate's
          # 1.94 MSRV. OpenBSD 7.9 ships rust 1.94.1, making it the first image
          # new enough to build this release.
          release: "7.9"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            pkg_add -I rust cmake git
          run: |
            set -eux
            # OpenBSD's default login class caps datasize well below what
            # rustc needs to link a binary this size; without this the build
            # dies in the linker rather than on anything meaningful.
            # The image's root login class has a 4 GiB hard data limit even
            # though the VM has 12 GiB. LLVM needs more than that for this
            # graph's final fat-LTO link. This shell runs as root, which may
            # raise its own hard limit up to the kernel maximum.
            ulimit -d unlimited
            echo "datasize soft=$(ulimit -Sd) hard=$(ulimit -Hd)"
            rustc --version
            # OpenBSD's default disklabel carves the disk into many small
            # partitions, and the one holding /root — where CARGO_HOME lives —
            # is far too small: unpacking aws-lc-sys alone exhausted it with
            # ENOSPC. Put both the registry and target/ on whichever mount
            # actually has room rather than hardcoding a guess, since the
            # layout can shift under us on an image bump. df stays in the log
            # because it is the first thing worth reading if this recurs.
            df -h
            BIG="$(df -k | awk 'NR > 1 && $4 > max { max = $4; mp = $NF } END { print mp }')"
            echo "cargo scratch on $BIG"
            export CARGO_HOME="$BIG/cargo"
            export CARGO_TARGET_DIR="$BIG/target"
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" ./atomscan
            # This is the W^X canary — see the note above the job.
            cargo test --locked --lib || echo "::warning::OpenBSD unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-openbsd.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-openbsd
          path: atomscan-x86_64-unknown-openbsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  # NetBSD rounds out the BSDs. src/fetch.rs already knows the platform string,
  # and pkgsrc rust is the same deal as FreeBSD ports rust.
  netbsd:
    name: x86_64-unknown-netbsd
    if: ${{ inputs.target == '' || inputs.target == 'x86_64-unknown-netbsd' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in NetBSD VM
        uses: vmactions/netbsd-vm@00081e82b14bc40114eb97f32b4455306828516b # v1.4.6
        with:
          usesh: true
          # Latest stable image published by vmactions.
          release: "11.0"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            /usr/sbin/pkg_add rust cmake git pkg-config
          run: |
            set -eux
            rustc --version
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "/tmp/target/$BUILD_PROFILE/atomscan" --version
            cp "/tmp/target/$BUILD_PROFILE/atomscan" ./atomscan
            cargo test --locked --lib || echo "::warning::NetBSD unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-netbsd.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-netbsd
          path: atomscan-x86_64-unknown-netbsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  # illumos, by way of OmniOS. Expected to fail, and that is the point: the
  # known blocker is tree-sitter's src/portable/endian.h, which has no __sun
  # branch and bails with "platform not supported" — illumos spells those
  # macros in <sys/byteorder.h>. Everything up to that point cross-built fine
  # when this was last attempted, C and C++ deps included, so the job should
  # reach the same wall and hand us a current error to work from.
  # DragonFlyBSD is the closest sibling to a target that already works: it uses
  # FreeBSD's pkg, and Cargo.toml has excluded it from jemalloc alongside
  # FreeBSD since long before this job existed, so the code already anticipates
  # it. Tier 3 in rustc, hence the native build against ports rust.
  dragonfly:
    name: x86_64-unknown-dragonfly
    if: ${{ inputs.target == '' || inputs.target == 'x86_64-unknown-dragonfly' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in DragonFlyBSD VM
        uses: vmactions/dragonflybsd-vm@bc8ccbaa091ce3624c93f2dc328ae48129b07580 # v1.3.1
        with:
          usesh: true
          # This is the newest image vmactions publishes. DragonFly's official
          # DPorts tree currently stops at rustc 1.85.1, below our 1.94 MSRV;
          # continue-on-error keeps the job as an honest compatibility canary
          # until the OS package catches up.
          release: "6.4.2"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            pkg install -y rust cmake pkgconf git
          run: |
            set -eux
            rustc --version
            # target/ out of the synced workspace: the action rsyncs it back to
            # the host and a full target/ is tens of GB.
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "/tmp/target/$BUILD_PROFILE/atomscan" --version
            cp "/tmp/target/$BUILD_PROFILE/atomscan" ./atomscan
            cargo test --locked --lib || echo "::warning::DragonFlyBSD unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-dragonfly.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-dragonfly
          path: atomscan-x86_64-unknown-dragonfly.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Haiku and GNU/Hurd have full-std, host-capable rustc targets, but both are
  # Rust Tier 3 and have no official rustup toolchains. Keep these opt-in until
  # a targeted release build proves the native package toolchain and our C/C++
  # dependency graph. If they succeed, their normal atomscan-* artifact names
  # make them immediately eligible for release publication.
  haiku:
    name: x86_64-unknown-haiku
    if: ${{ inputs.target == 'x86_64-unknown-haiku' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in Haiku VM
        uses: vmactions/haiku-vm@0ba6b98c8d7e5626f9defdd7403af49ad72b51df # v1.1.3
        with:
          release: "r1beta5"
          cpu: "4"
          mem: "12288"
          usesh: true
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            # R1/beta5 ships OpenSSL 3.0, while Cargo in rust_bin 1.94.1 was
            # linked against SSL_get0_group_name@OPENSSL_3.2.0. rust_bin's
            # dependency only says libssl >= 3, so package resolution does not
            # otherwise upgrade the satisfied-but-too-old base library.
            pkgman update -y openssl3
            pkgman install -y rust_bin cmake git
          run: |
            set -eux
            openssl version
            rustc --version --verbose
            cargo --version --verbose
            df -h . /tmp
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" ./atomscan
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-haiku.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-haiku
          path: atomscan-x86_64-unknown-haiku.tar.gz
          if-no-files-found: error
          retention-days: 14

  hurd:
    name: x86_64-unknown-hurd-gnu
    if: ${{ inputs.target == 'x86_64-unknown-hurd-gnu' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in GNU/Hurd VM
        uses: vmactions/hurd-vm@12ce185b5e88948ae6f23f8675d356a35ff665f3 # v1.0.0
        with:
          release: "2025"
          cpu: "4"
          mem: "12288"
          usesh: true
          # Keep Cargo's registry and fat-LTO output on the host-backed mount;
          # the Hurd guest image does not have enough disk for both.
          sync: nfs
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential cargo cmake git pkg-config rustc
            apt-get clean
          run: |
            set -eux
            rustc --version --verbose
            cargo --version --verbose
            df -h . /
            installed="$(rustc --version | awk '{print $2}')"
            if dpkg --compare-versions "$installed" lt 1.94; then
              echo "::error::GNU/Hurd provides rustc $installed; atomscan requires Rust 1.94 or newer"
              exit 1
            fi
            export CARGO_HOME="$PWD/.native-cargo"
            export CARGO_TARGET_DIR="$PWD/.native-target"
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" ./atomscan
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-hurd-gnu.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-hurd-gnu
          path: atomscan-x86_64-unknown-hurd-gnu.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Solaris 11.4 — the only thing that actually exercises the Solaris half of
  # the tree-sitter __sun branch we added; the illumos jobs only prove the
  # illumos half. Uses the -gcc image variant, which ships the toolchain.
  #
  # Expected to be rocky: Oracle's IPS repo may carry no rust at all, in which
  # case this fails in `prepare` and the enumeration below is what tells us.
  # Same research shape the OmniOS job used to resolve its package names.
  solaris:
    name: x86_64-pc-solaris
    if: ${{ inputs.target == '' || inputs.target == 'x86_64-pc-solaris' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in Solaris VM
        uses: vmactions/solaris-vm@315163f088b66e55bbcc45928bd224d4973b2312 # v1.3.8
        with:
          release: "11.4-gcc"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            set -eux
            # Confirmed by the enumeration in run 30598384692: Oracle's IPS
            # ships no rust at all. rust-lang does publish an official
            # x86_64-pc-solaris standalone build, which is what we use.
            # cmake is for aws-lc-sys; git because five deps are git deps.
            pkg install --accept developer/build/cmake developer/versioning/git || true
            RUST_VERSION=1.97.1
            TARBALL="rust-${RUST_VERSION}-x86_64-pc-solaris.tar.gz"
            # Solaris tar cannot decompress; pipe through gzip explicitly.
            curl -fsSLO "https://static.rust-lang.org/dist/${TARBALL}"
            gzip -dc "${TARBALL}" | tar xf -
            "./rust-${RUST_VERSION}-x86_64-pc-solaris/install.sh" --prefix=/usr/local --disable-ldconfig
            rm -rf "rust-${RUST_VERSION}-x86_64-pc-solaris" "${TARBALL}"
            # Solaris, like illumos, reserves backing store for the full
            # address space of both processes during fork(). The final fat-LTO
            # rustc process is large enough that spawning gcc otherwise fails
            # with ENOMEM. The VM image has a 199G rpool, so give the fork a
            # dedicated ZFS-backed swap volume.
            /usr/sbin/zpool list rpool
            /usr/sbin/zfs create -V 32G rpool/ci-swap
            /usr/sbin/swap -a /dev/zvol/dsk/rpool/ci-swap
            /usr/sbin/swap -l
          run: |
            set -eux
            PATH="/usr/local/bin:$PATH"
            export PATH
            command -v cargo || { echo "::error::rust install did not put cargo on PATH"; exit 1; }
            rustc --version
            # /tmp is swap-backed tmpfs on Solaris, same as illumos.
            export CARGO_TARGET_DIR=/var/tmp/target
            # unrar_sys builds C++, but cc-rs cannot infer Solaris's C++
            # standard library from the target name. Tell it to link libstdc++.
            export CXXSTDLIB=stdc++
            # cc-rs's hint does not reach Cargo's final Rust link, so make that
            # gcc invocation link the GCC C++ runtime as well.
            export RUSTFLAGS="-C link-arg=-lstdc++"
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" ./atomscan
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-pc-solaris.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-pc-solaris
          path: atomscan-x86_64-pc-solaris.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Artifact deliberately NOT named atomscan-x86_64-unknown-illumos: the cross
  # job builds that same target and owns the release-bound name, and
  # upload-artifact rejects a duplicate name within a run. This one is a
  # native-environment check, so its artifact stays outside the `atomscan-*`
  # pattern release.yml downloads.
  omnios:
    name: x86_64-unknown-illumos (omnios)
    if: ${{ inputs.target == '' || inputs.target == 'omnios-native' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Build in OmniOS VM
        uses: vmactions/omnios-vm@027e3ec08fed6fb740ab5f300c2605f9de02997a # v1.3.4
        with:
          usesh: true
          # Newest image the builder publishes. Unlike the FreeBSD pin, newer
          # is the safer choice here: the risk is OmniOS's packaged rust being
          # too old for this crate graph, not ABI reach.
          release: "r151058"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            pkg publisher
            # Names resolved against r151058: rust and cmake live under the
            # extra.omnios publisher (ooce/), the rest under core. r151058
            # ships rust 1.97.1, comfortably over this crate's 1.94 MSRV —
            # unlike OpenBSD ports, which is the reason that target fails.
            # git is not optional: five of our dependencies are git deps.
            # `pkg list -a '*<name>*'` is how to re-derive these if an image
            # bump renames something.
            pkg install \
              ooce/developer/rust \
              ooce/developer/cmake \
              developer/versioning/git \
              developer/pkg-config \
              developer/gcc14
            # illumos does not overcommit: fork() reserves backing store for
            # the child's whole address space, so forking the linker out of a
            # multi-GB rustc during fat LTO fails with ENOMEM ("Not enough
            # space", os error 12) while RAM is still free. The cross-compiled
            # illumos build does not hit this because it forks on Linux, which
            # does overcommit. Back the reservation with swap; it is reserved,
            # not necessarily written, so this costs disk rather than time.
            # The root filesystem (including /var/tmp) is ZFS, which does not
            # support regular files as swap. A mkfile-created swapfile fails
            # with "size is invalid". Add a ZFS volume instead; the image's
            # root pool is named rpool. The earlier 4G volume was still too
            # small for the final fat-LTO rustc process in release run
            # 30966163861, while the image reports 194G free in rpool.
            /usr/sbin/zpool list rpool
            /usr/sbin/zfs create -V 32G rpool/ci-swap
            /usr/sbin/swap -a /dev/zvol/dsk/rpool/ci-swap
            /usr/sbin/swap -l
          run: |
            set -eux
            rustc --version
            # rustc invokes `gcc` as the linker, but OmniOS installs its gcc
            # packages under a versioned prefix that is not on the default
            # PATH, so the link step fails with "could not exec the linker".
            # Search rather than hardcode: the prefix moves with the package
            # version, and the listing is what to read if a bump breaks this.
            for d in /opt/gcc-*/bin /opt/ooce/gcc-*/bin /usr/gcc/*/bin; do
              [ -x "$d/gcc" ] && PATH="$d:$PATH"
            done
            export PATH
            command -v gcc || { echo "::error::no gcc on PATH"; ls -d /opt/* /usr/gcc/* 2>/dev/null; exit 1; }
            gcc --version | head -1
            # /tmp on illumos is swap-backed tmpfs, so a target/ this size
            # would be charged against RAM. /var/tmp is real disk.
            export CARGO_TARGET_DIR=/var/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" ./atomscan
            cargo test --locked --lib || echo "::warning::OmniOS unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf omnios-native-atomscan.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnios-native-atomscan
          path: omnios-native-atomscan.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Native Windows release artifact, including execution smoke tests. The full
  # MSVC build first went green in release run 30966163861, so this is now a
  # required target rather than a diagnostic. `shell: bash` throughout because
  # every other run block in this file is sh, and git bash ships on the image.
  windows:
    name: x86_64-pc-windows-msvc
    if: ${{ inputs.target == '' || inputs.target == 'x86_64-pc-windows-msvc' }}
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Install target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version --verbose

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-windows-

      - name: Build
        env:
          PROFILE: ${{ inputs.profile }}
        run: cargo build --locked --profile "$PROFILE" --target x86_64-pc-windows-msvc --bin atomscan

      - name: Smoke test
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          "./target/x86_64-pc-windows-msvc/$PROFILE/atomscan.exe" --version
          "./target/x86_64-pc-windows-msvc/$PROFILE/atomscan.exe" --help >/dev/null

      - name: Package
        env:
          PROFILE: ${{ inputs.profile }}
        run: tar -czf atomscan-x86_64-pc-windows-msvc.tar.gz -C "target/x86_64-pc-windows-msvc/$PROFILE" atomscan.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-pc-windows-msvc
          path: atomscan-x86_64-pc-windows-msvc.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Targets needing a cross toolchain the runner image doesn't ship.
  #
  # musl lives here rather than in `native` because Ubuntu's musl-tools provides
  # only musl-gcc (C). unrar_sys builds C++ and asks for x86_64-linux-musl-g++,
  # and Debian/Ubuntu package no musl g++ at all. cross-rs's musl image is
  # musl-cross-make with C++ support (`cpp = true` in its targets.toml).
  #
  # Supply-chain caveat: `cross` pulls ghcr.io/cross-rs/<target>:<version>, a
  # third-party container image, pinned here by version tag. Pin it by digest in
  # a Cross.toml before this feeds a published release.
  #
  # If an image turns out to be missing something (aws-lc-sys wants cmake for
  # platforms it has no prebuilt path for), the alternative is cargo-zigbuild:
  # zig cc/c++ covers musl including libc++, and runs directly on the runner
  # where cmake already exists.
  cross:
    name: ${{ matrix.target }}
    if: ${{ inputs.target == '' || contains(' x86_64-unknown-linux-musl aarch64-unknown-linux-musl arm-unknown-linux-musleabihf armv7-unknown-linux-musleabihf loongarch64-unknown-linux-musl x86_64-unknown-illumos s390x-unknown-linux-gnu riscv64gc-unknown-linux-gnu powerpc64le-unknown-linux-gnu ', format(' {0} ', inputs.target)) }}
    # Container builds, so the host's glibc never reaches the artifact — same
    # reasoning as the freebsd job, and unlike `native`.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable Linux artifact: no glibc floor at all. jemalloc still
          # applies here (Cargo.toml only excludes the BSDs and illumos), so
          # this doesn't inherit musl-malloc's allocator performance.
          - target: x86_64-unknown-linux-musl
            smoke: true

          # Same artifact for arm64. No smoke test: the runner is x86_64, so
          # there is nothing here that can execute it.
          - target: aarch64-unknown-linux-musl

          # Static ARMv6 hard-float covers Raspberry Pi 1/Zero-class Linux
          # systems without inheriting the build container's libc. Wasmtime
          # uses its portable Pulley backend because Cranelift has no ARM32
          # backend. QEMU verifies that the resulting CLI starts correctly.
          - target: arm-unknown-linux-musleabihf
            emulated_smoke: true

          # ARMv7-A is still common in routers, cameras, NAS appliances and
          # industrial gateways. The static artifact works on glibc, musl and
          # uClibc userlands that use the standard hard-float ABI.
          - target: armv7-unknown-linux-musleabihf
            emulated_smoke: true

          # LoongArch64 is an edge/server target rather than a constrained MCU
          # target. Its Rust and Cross support are Tier 2 and QEMU-capable; use
          # musl so the artifact has no glibc 2.36 floor.
          - target: loongarch64-unknown-linux-musl
            emulated_smoke: true

          # Back after the tree-sitter endian.h fix (see the [patch.crates-io]
          # note in Cargo.toml). This is the cheapest verification we have that
          # the fix works: it reproduces the exact failure recorded in CI run
          # 30161197323 in a container, in minutes, without a VM. Build-only —
          # nothing here can execute an illumos binary.
          - target: x86_64-unknown-illumos

          # The only big-endian target we build. Worth more than its user base
          # suggests: every binary parser in the graph (PE/ELF/Mach-O headers,
          # archive indices, the tree-sitter endian.h we just patched) reads
          # multi-byte fields, and nothing else in this matrix would catch a
          # byte-order bug. Build-only, like every entry here.
          - target: s390x-unknown-linux-gnu
            emulated_smoke: true

          - target: riscv64gc-unknown-linux-gnu

          - target: powerpc64le-unknown-linux-gnu


    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Reclaim runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cross
          key: cargo-home-${{ matrix.target }}-${{ env.CROSS_REV }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-${{ matrix.target }}-

      # Cross 0.2.5 cannot provision LoongArch's Rust std. Use a reviewed Cross
      # revision that supports it, and keep the container images themselves
      # pinned by digest in Cross.toml. The version check prevents an older
      # cached 0.2.5 binary from silently winning.
      - name: Install cross
        run: |
          if ! cross --version 2>/dev/null | grep -q "${CROSS_REV:0:7}"; then
            cargo install cross --locked --force \
              --git https://github.com/cross-rs/cross --rev "$CROSS_REV"
          fi

      # A manually dispatched release can intentionally build an older tag
      # with the current workflow. Supply newly required build settings even
      # when that tag's Cross.toml predates them.
      - name: Prepare cross compatibility config
        run: |
          if ! grep -q 'CFLAGS_x86_64_unknown_illumos' Cross.toml; then
            cp Cross.toml "$RUNNER_TEMP/atomscan-cross.toml"
            sed -i '/^]$/i\    "CFLAGS_x86_64_unknown_illumos",' "$RUNNER_TEMP/atomscan-cross.toml"
            echo "CROSS_CONFIG=$RUNNER_TEMP/atomscan-cross.toml" >> "$GITHUB_ENV"
          fi

      # See Cross.toml for why these targets need compiler flags and why each
      # is scoped rather than global. Cross.toml passes them through.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
          CXXFLAGS_s390x_unknown_linux_gnu: "-include cstddef"
          CXXFLAGS_powerpc64le_unknown_linux_gnu: "-include cstddef"
          CFLAGS_x86_64_unknown_illumos: "-D__EXTENSIONS__"
        run: cross build --locked --profile "$PROFILE" --target "$TARGET" --bin atomscan

      - name: Inspect
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: file "target/$TARGET/$PROFILE/atomscan"

      # A static musl binary runs on the runner as-is, so this is a real smoke
      # test rather than a `file` sanity check. Targets that can't execute here
      # (illumos, when it returns) just leave `smoke` unset.
      - name: Smoke test
        if: matrix.smoke
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          "./target/$TARGET/$PROFILE/atomscan" --version
          "./target/$TARGET/$PROFILE/atomscan" --help >/dev/null

      # Cross supplies QEMU and the target sysroot for these architectures.
      # Running through `cross run` checks the loader, ISA and startup path;
      # `file` alone would only prove that the linker emitted some ELF bytes.
      - name: Emulated smoke test
        if: matrix.emulated_smoke
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          cross run --locked --profile "$PROFILE" --target "$TARGET" --bin atomscan -- --version
          cross run --locked --profile "$PROFILE" --target "$TARGET" --bin atomscan -- --help >/dev/null

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: tar -czf "atomscan-$TARGET.tar.gz" -C "target/$TARGET/$PROFILE" atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-${{ matrix.target }}
          path: atomscan-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
