# Reusable build matrix — the single definition of "what platforms we ship and
# how". Called by ci.yml (thin LTO, ad-hoc macOS signature) and by release.yml
# (fat LTO, plus whatever signing the `sign`/`notarize` inputs ask for). Keeping
# one matrix means CI and release can't drift into building different things.
#
# See ci.yml for the hardening rationale that applies to both callers.

name: build

on:
  workflow_call:
    inputs:
      profile:
        description: >-
          Cargo profile: `release` (thin LTO, everyday CI) or `release-lto`
          (fat LTO + one codegen unit, distribution builds).
        type: string
        default: release
      sign:
        description: >-
          Sign the macOS binaries with the Developer ID identity. Requires the
          MACOS_CERT_* and MACOS_SIGN_IDENTITY secrets; falls back to an ad-hoc
          signature when false.
        type: boolean
        default: false
      notarize:
        description: >-
          Submit the signed binaries to Apple's notary service. Implies `sign`
          and needs the MACOS_NOTARY_* secrets. Off by default: notarization is
          the slowest and most failure-prone step here, and an unnotarized
          build is still perfectly runnable locally — it only costs a Gatekeeper
          prompt on machines that downloaded it.
        type: boolean
        default: false
    secrets:
      MACOS_CERT_P12:
        description: Base64-encoded .p12 holding the Developer ID Application cert + key.
        required: false
      MACOS_CERT_PASSWORD:
        description: Password the .p12 was exported with.
        required: false
      MACOS_SIGN_IDENTITY:
        description: 'Identity to sign with, e.g. "Developer ID Application: Name (TEAMID)".'
        required: false
      MACOS_NOTARY_KEY:
        description: Base64-encoded App Store Connect API key (.p8).
        required: false
      MACOS_NOTARY_KEY_ID:
        description: App Store Connect key ID.
        required: false
      MACOS_NOTARY_ISSUER:
        description: App Store Connect issuer UUID.
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  SCAN_NO_UPDATE: "1"

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc floor comes from the runner: 22.04 is glibc 2.35. Bumping to
          # ubuntu-24.04 raises it to 2.39 and silently drops older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
            test: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            native: true

          - target: aarch64-apple-darwin
            os: macos-15
            native: true
            test: true

          # Cross-built on the arm64 runner: the macOS SDK carries both slices,
          # and GitHub is retiring the Intel runners. Build-only — Rosetta is
          # not guaranteed on the arm64 image, so we can't smoke it here.
          - target: x86_64-apple-darwin
            os: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 708 crates, a ~139 MB binary, and several C deps: the stock runner
      # image leaves ~25 GB free on / and this build will use a good chunk.
      - name: Reclaim runner disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          rustc --version --verbose

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Registry + git checkouts only, never target/. The five git deps are
          # large and re-cloned on every miss; target/ dirs for this graph run
          # to tens of GB and would blow the 10 GB per-repo cache budget.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-${{ matrix.target }}-

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: cargo build --locked --profile "$PROFILE" --target "$TARGET" --bin atomscan

      # `--lib` only, mirroring `make test-unit`. The integration tests in
      # tests/ each link their own copy of a very large binary; enabling them
      # here needs a look at wall-clock and disk first. The model-dependent
      # tests are already #[ignore]d.
      - name: Test
        if: matrix.test
        run: cargo test --locked --lib

      # --- macOS signing ------------------------------------------------------
      # Unsigned path: an ad-hoc signature, matching what `make release` does on
      # Darwin. Good enough for CI artifacts, useless for distribution.
      - name: Ad-hoc codesign
        if: ${{ runner.os == 'macOS' && !inputs.sign }}
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: codesign --force --sign - "target/$TARGET/$PROFILE/atomscan"

      # Signed path: import the Developer ID cert into a throwaway keychain
      # that exists only for this job. Never touch the runner's login keychain,
      # and never leave the .p12 on disk.
      - name: Import Developer ID certificate
        if: ${{ runner.os == 'macOS' && inputs.sign }}
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          # Fail with something readable instead of letting `security import`
          # choke on a zero-byte .p12, which is what an unset secret produces.
          if [ -z "$CERT_P12" ]; then
            echo "::error::sign=true but MACOS_CERT_P12 is not set - configure the signing secrets or call this workflow with sign=false"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/atomdrift-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend ours to the existing user keychain list. The word splitting
          # is deliberate — each existing keychain has to land as its own
          # argument — and the paths come from `security` itself, not us.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Hardened runtime is mandatory for notarization, and hardened runtime
      # blocks JIT by default — which would kill us, because yara-x runs its
      # compiled rules through wasmtime/cranelift at load time. Hence the
      # allow-jit entitlement in .github/macos-entitlements.plist.
      - name: Sign with Developer ID
        if: ${{ runner.os == 'macOS' && inputs.sign }}
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -eu
          BIN="target/$TARGET/$PROFILE/atomscan"
          codesign --force --timestamp --options runtime \
            --entitlements .github/macos-entitlements.plist \
            --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign --display --entitlements - "$BIN"

      - name: Notarize
        if: ${{ runner.os == 'macOS' && inputs.sign && inputs.notarize }}
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -eu
          BIN="target/$TARGET/$PROFILE/atomscan"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          /usr/bin/ditto -c -k "$BIN" "$RUNNER_TEMP/atomscan.zip"
          xcrun notarytool submit "$RUNNER_TEMP/atomscan.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/atomscan.zip"
          # A bare Mach-O can't be stapled — `stapler` only handles bundles,
          # .dmg and .pkg — so Gatekeeper resolves the ticket online the first
          # time a downloaded copy runs. Ship a signed .pkg if you ever need
          # offline-verifiable direct downloads.

      - name: Remove signing keychain
        if: ${{ always() && runner.os == 'macOS' && inputs.sign }}
        run: |
          set -eu
          [ -n "${SIGNING_KEYCHAIN:-}" ] || exit 0
          security delete-keychain "$SIGNING_KEYCHAIN" || true
      # ------------------------------------------------------------------------

      - name: Smoke test
        if: matrix.native
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          file "target/$TARGET/$PROFILE/atomscan"
          "./target/$TARGET/$PROFILE/atomscan" --version
          "./target/$TARGET/$PROFILE/atomscan" --help >/dev/null

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: tar -czf "atomscan-$TARGET.tar.gz" -C "target/$TARGET/$PROFILE" atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-${{ matrix.target }}
          path: atomscan-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Native build in a KVM-accelerated VM, which is the only way to actually run
  # the test suite on FreeBSD. Uses the OS's packaged rust, so it also tells us
  # when ports rust drifts below our MSRV.
  # aarch64-unknown-freebsd was tried here on ubuntu-24.04-arm and removed:
  # that image does not give the guest KVM, so qemu falls back to TCG. The
  # x86_64 build takes ~46 min accelerated; emulated, the arm64 one was still
  # compiling at 2h16m against the 150 min cap. Don't re-add it without a host
  # that can actually accelerate an aarch64 guest — raising the timeout just
  # buys a 4-6 hour job for one target.
  freebsd:
    name: x86_64-unknown-freebsd
    # Host image is only the VM host here — the compile happens inside the
    # guest against FreeBSD's libc — so the glibc-floor reasoning that pins
    # `native` to 22.04 does not apply. Newer host, newer KVM stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          usesh: true
          # Newest image the builder publishes, pinned explicitly rather than
          # left to the action's default, since an image that changes under us
          # is an unreviewed dependency.
          #
          # Tradeoff: this was 14.3 so the artifact stayed runnable on 14.x as
          # well as 15.x — FreeBSD binaries run forward across majors, not
          # backward. Building on 15.0 means 15.x only. Drop back to 14.3 if
          # 14.x reach matters more than a current ports rust (which is also
          # what keeps this job's MSRV headroom).
          release: "15.0"
          # Runner is 4 vCPU / 16 GB; leave the host a couple of GB. The link
          # step for a binary this size is the memory high-water mark.
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          # cmake is for aws-lc-sys, which has no prebuilt path off the tier-1
          # platforms and falls back to a CMake build.
          prepare: |
            pkg install -y rust cmake pkgconf git
          run: |
            set -eux
            rustc --version
            # Keep target/ out of the synced workspace: the action rsyncs the
            # workspace back to the host at the end, and a full target/ is tens
            # of GB. Only the finished binary gets copied in.
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "/tmp/target/$BUILD_PROFILE/atomscan" --version
            cp "/tmp/target/$BUILD_PROFILE/atomscan" ./atomscan
            # Non-fatal during bring-up: this is the first time the suite has
            # run on FreeBSD in CI, and we want the artifact either way. Make
            # it fatal once we know it's green.
            cargo test --locked --lib || echo "::warning::FreeBSD unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-freebsd.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-freebsd
          path: atomscan-x86_64-unknown-freebsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Same VM pattern as freebsd, and src/ is already OpenBSD-aware: lib.rs,
  # main.rs, thread_dump.rs and server/handlers.rs all carry openbsd arms, and
  # the jemalloc exclusion in Cargo.toml documents OpenBSD's version-string
  # format breaking tikv-jemalloc-sys's configure.
  #
  # The open question is not whether it builds, it is whether it *runs*.
  # OpenBSD kills processes that map W|X pages outside a `wxallowed` mount, and
  # yara-x compiles its rules to WebAssembly and JITs them through
  # wasmtime/cranelift — the same JIT that forced the allow-jit entitlement on
  # macOS. Rules are only compiled on an actual scan, so `--version` proves
  # nothing here; the unit tests below are what would surface it.
  openbsd:
    name: x86_64-unknown-openbsd
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@c941015845c0f0c429676840963dc63b226d4f69 # v1.4.5
        with:
          usesh: true
          # Newest image available. OpenBSD makes no cross-release ABI promise,
          # so there is no reach argument for staying back — the artifact is
          # effectively single-release either way, and this pin needs bumping
          # every six months. 7.7's ports rust was 1.86, well under this
          # crate's 1.94 MSRV, which is what failed here before; 7.8 is the
          # only chance of a toolchain new enough to build at all.
          release: "7.8"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            pkg_add -I rust cmake git
          run: |
            set -eux
            # OpenBSD's default login class caps datasize well below what
            # rustc needs to link a binary this size; without this the build
            # dies in the linker rather than on anything meaningful.
            ulimit -d "$(ulimit -Hd)" || true
            rustc --version
            # OpenBSD's default disklabel carves the disk into many small
            # partitions, and the one holding /root — where CARGO_HOME lives —
            # is far too small: unpacking aws-lc-sys alone exhausted it with
            # ENOSPC. Put both the registry and target/ on whichever mount
            # actually has room rather than hardcoding a guess, since the
            # layout can shift under us on an image bump. df stays in the log
            # because it is the first thing worth reading if this recurs.
            df -h
            BIG="$(df -k | awk 'NR > 1 && $4 > max { max = $4; mp = $NF } END { print mp }')"
            echo "cargo scratch on $BIG"
            export CARGO_HOME="$BIG/cargo"
            export CARGO_TARGET_DIR="$BIG/target"
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" ./atomscan
            # This is the W^X canary — see the note above the job.
            cargo test --locked --lib || echo "::warning::OpenBSD unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-openbsd.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-openbsd
          path: atomscan-x86_64-unknown-openbsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  # NetBSD rounds out the BSDs. src/fetch.rs already knows the platform string,
  # and NetBSD's backwards-compat story is strong enough that a 10.x artifact
  # should stay runnable. pkgsrc rust is the same deal as FreeBSD ports rust.
  netbsd:
    name: x86_64-unknown-netbsd
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in NetBSD VM
        uses: vmactions/netbsd-vm@e7ac71b97abbe8437cec8859a5acf72dfa6a8be0 # v1.4.5
        with:
          usesh: true
          release: "10.1"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            /usr/sbin/pkg_add rust cmake git pkg-config
          run: |
            set -eux
            rustc --version
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "/tmp/target/$BUILD_PROFILE/atomscan" --version
            cp "/tmp/target/$BUILD_PROFILE/atomscan" ./atomscan
            cargo test --locked --lib || echo "::warning::NetBSD unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-netbsd.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-netbsd
          path: atomscan-x86_64-unknown-netbsd.tar.gz
          if-no-files-found: error
          retention-days: 14

  # illumos, by way of OmniOS. Expected to fail, and that is the point: the
  # known blocker is tree-sitter's src/portable/endian.h, which has no __sun
  # branch and bails with "platform not supported" — illumos spells those
  # macros in <sys/byteorder.h>. Everything up to that point cross-built fine
  # when this was last attempted, C and C++ deps included, so the job should
  # reach the same wall and hand us a current error to work from.
  # DragonFlyBSD is the closest sibling to a target that already works: it uses
  # FreeBSD's pkg, and Cargo.toml has excluded it from jemalloc alongside
  # FreeBSD since long before this job existed, so the code already anticipates
  # it. Tier 3 in rustc, hence the native build against ports rust.
  dragonfly:
    name: x86_64-unknown-dragonfly
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in DragonFlyBSD VM
        uses: vmactions/dragonflybsd-vm@bc8ccbaa091ce3624c93f2dc328ae48129b07580 # v1.3.1
        with:
          usesh: true
          release: "6.4.2"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            pkg install -y rust cmake pkgconf git
          run: |
            set -eux
            rustc --version
            # target/ out of the synced workspace: the action rsyncs it back to
            # the host and a full target/ is tens of GB.
            export CARGO_TARGET_DIR=/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "/tmp/target/$BUILD_PROFILE/atomscan" --version
            cp "/tmp/target/$BUILD_PROFILE/atomscan" ./atomscan
            cargo test --locked --lib || echo "::warning::DragonFlyBSD unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-unknown-dragonfly.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-unknown-dragonfly
          path: atomscan-x86_64-unknown-dragonfly.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Solaris 11.4 — the only thing that actually exercises the Solaris half of
  # the tree-sitter __sun branch we added; the illumos jobs only prove the
  # illumos half. Uses the -gcc image variant, which ships the toolchain.
  #
  # Expected to be rocky: Oracle's IPS repo may carry no rust at all, in which
  # case this fails in `prepare` and the enumeration below is what tells us.
  # Same research shape the OmniOS job used to resolve its package names.
  solaris:
    name: x86_64-pc-solaris
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in Solaris VM
        uses: vmactions/solaris-vm@315163f088b66e55bbcc45928bd224d4973b2312 # v1.3.8
        with:
          release: "11.4-gcc"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            set -eux
            # Confirmed by the enumeration in run 30598384692: Oracle's IPS
            # ships no rust at all. rust-lang does publish an official
            # x86_64-pc-solaris standalone build, which is what we use.
            # cmake is for aws-lc-sys; git because five deps are git deps.
            pkg install --accept developer/build/cmake developer/versioning/git || true
            RUST_VERSION=1.97.1
            TARBALL="rust-${RUST_VERSION}-x86_64-pc-solaris.tar.gz"
            # Solaris tar cannot decompress; pipe through gzip explicitly.
            curl -fsSLO "https://static.rust-lang.org/dist/${TARBALL}"
            gzip -dc "${TARBALL}" | tar xf -
            "./rust-${RUST_VERSION}-x86_64-pc-solaris/install.sh" --prefix=/usr/local --disable-ldconfig
            rm -rf "rust-${RUST_VERSION}-x86_64-pc-solaris" "${TARBALL}"
          run: |
            set -eux
            PATH="/usr/local/bin:$PATH"
            export PATH
            command -v cargo || { echo "::error::rust install did not put cargo on PATH"; exit 1; }
            rustc --version
            # /tmp is swap-backed tmpfs on Solaris, same as illumos.
            export CARGO_TARGET_DIR=/var/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" ./atomscan
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf atomscan-x86_64-pc-solaris.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-pc-solaris
          path: atomscan-x86_64-pc-solaris.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Artifact deliberately NOT named atomscan-x86_64-unknown-illumos: the cross
  # job builds that same target and owns the release-bound name, and
  # upload-artifact rejects a duplicate name within a run. This one is a
  # native-environment check, so its artifact stays outside the `atomscan-*`
  # pattern release.yml downloads.
  omnios:
    name: x86_64-unknown-illumos (omnios)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in OmniOS VM
        uses: vmactions/omnios-vm@027e3ec08fed6fb740ab5f300c2605f9de02997a # v1.3.4
        with:
          usesh: true
          # Newest image the builder publishes. Unlike the FreeBSD pin, newer
          # is the safer choice here: the risk is OmniOS's packaged rust being
          # too old for this crate graph, not ABI reach.
          release: "r151058"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE SCAN_NO_UPDATE BUILD_PROFILE"
          prepare: |
            pkg publisher
            # Names resolved against r151058: rust and cmake live under the
            # extra.omnios publisher (ooce/), the rest under core. r151058
            # ships rust 1.97.1, comfortably over this crate's 1.94 MSRV —
            # unlike OpenBSD ports, which is the reason that target fails.
            # git is not optional: five of our dependencies are git deps.
            # `pkg list -a '*<name>*'` is how to re-derive these if an image
            # bump renames something.
            pkg install \
              ooce/developer/rust \
              ooce/developer/cmake \
              developer/versioning/git \
              developer/pkg-config \
              developer/gcc14
            # illumos does not overcommit: fork() reserves backing store for
            # the child's whole address space, so forking the linker out of a
            # multi-GB rustc during fat LTO fails with ENOMEM ("Not enough
            # space", os error 12) while RAM is still free. The cross-compiled
            # illumos build does not hit this because it forks on Linux, which
            # does overcommit. Back the reservation with swap; it is reserved,
            # not necessarily written, so this costs disk rather than time.
            mkfile 8g /var/tmp/swapfile
            swap -a /var/tmp/swapfile
            swap -l
          run: |
            set -eux
            rustc --version
            # rustc invokes `gcc` as the linker, but OmniOS installs its gcc
            # packages under a versioned prefix that is not on the default
            # PATH, so the link step fails with "could not exec the linker".
            # Search rather than hardcode: the prefix moves with the package
            # version, and the listing is what to read if a bump breaks this.
            for d in /opt/gcc-*/bin /opt/ooce/gcc-*/bin /usr/gcc/*/bin; do
              [ -x "$d/gcc" ] && PATH="$d:$PATH"
            done
            export PATH
            command -v gcc || { echo "::error::no gcc on PATH"; ls -d /opt/* /usr/gcc/* 2>/dev/null; exit 1; }
            gcc --version | head -1
            # /tmp on illumos is swap-backed tmpfs, so a target/ this size
            # would be charged against RAM. /var/tmp is real disk.
            export CARGO_TARGET_DIR=/var/tmp/target
            cargo build --locked --profile "$BUILD_PROFILE" --bin atomscan
            "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" --version
            cp "$CARGO_TARGET_DIR/$BUILD_PROFILE/atomscan" ./atomscan
            cargo test --locked --lib || echo "::warning::OmniOS unit tests failed"
        env:
          BUILD_PROFILE: ${{ inputs.profile }}

      - name: Package
        run: tar -czf omnios-native-atomscan.tar.gz atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnios-native-atomscan
          path: omnios-native-atomscan.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Deliberately expected to fail — this job exists to produce a log, not an
  # artifact. src/ has zero cfg(windows) arms against 10 cfg(unix) ones, libc
  # and backtrace are [target.'cfg(unix)'.dependencies], and the dep graph is
  # unproven on MSVC (unrar_sys is C++, aws-lc-sys wants nasm, proclist does
  # process enumeration). Read the first error, fix or file it, repeat. Nothing
  # speculative is installed here: a fix-it-in-advance step would just move the
  # failure somewhere less informative.
  #
  # `shell: bash` throughout because every other run block in this file is sh,
  # and git bash ships on the Windows image.
  windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version --verbose

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-windows-

      - name: Build
        env:
          PROFILE: ${{ inputs.profile }}
        run: cargo build --locked --profile "$PROFILE" --target x86_64-pc-windows-msvc --bin atomscan

      - name: Smoke test
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          "./target/x86_64-pc-windows-msvc/$PROFILE/atomscan.exe" --version
          "./target/x86_64-pc-windows-msvc/$PROFILE/atomscan.exe" --help >/dev/null

      - name: Package
        env:
          PROFILE: ${{ inputs.profile }}
        run: tar -czf atomscan-x86_64-pc-windows-msvc.tar.gz -C "target/x86_64-pc-windows-msvc/$PROFILE" atomscan.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-x86_64-pc-windows-msvc
          path: atomscan-x86_64-pc-windows-msvc.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Targets needing a cross toolchain the runner image doesn't ship.
  #
  # musl lives here rather than in `native` because Ubuntu's musl-tools provides
  # only musl-gcc (C). unrar_sys builds C++ and asks for x86_64-linux-musl-g++,
  # and Debian/Ubuntu package no musl g++ at all. cross-rs's musl image is
  # musl-cross-make with C++ support (`cpp = true` in its targets.toml).
  #
  # Supply-chain caveat: `cross` pulls ghcr.io/cross-rs/<target>:<version>, a
  # third-party container image, pinned here by version tag. Pin it by digest in
  # a Cross.toml before this feeds a published release.
  #
  # If an image turns out to be missing something (aws-lc-sys wants cmake for
  # platforms it has no prebuilt path for), the alternative is cargo-zigbuild:
  # zig cc/c++ covers musl including libc++, and runs directly on the runner
  # where cmake already exists.
  cross:
    name: ${{ matrix.target }}
    # Container builds, so the host's glibc never reaches the artifact — same
    # reasoning as the freebsd job, and unlike `native`.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable Linux artifact: no glibc floor at all. jemalloc still
          # applies here (Cargo.toml only excludes the BSDs and illumos), so
          # this doesn't inherit musl-malloc's allocator performance.
          - target: x86_64-unknown-linux-musl
            smoke: true

          # Same artifact for arm64. No smoke test: the runner is x86_64, so
          # there is nothing here that can execute it.
          - target: aarch64-unknown-linux-musl

          # Back after the tree-sitter endian.h fix (see the [patch.crates-io]
          # note in Cargo.toml). This is the cheapest verification we have that
          # the fix works: it reproduces the exact failure recorded in CI run
          # 30161197323 in a container, in minutes, without a VM. Build-only —
          # nothing here can execute an illumos binary.
          - target: x86_64-unknown-illumos

          # The only big-endian target we build. Worth more than its user base
          # suggests: every binary parser in the graph (PE/ELF/Mach-O headers,
          # archive indices, the tree-sitter endian.h we just patched) reads
          # multi-byte fields, and nothing else in this matrix would catch a
          # byte-order bug. Build-only, like every entry here.
          - target: s390x-unknown-linux-gnu

          - target: riscv64gc-unknown-linux-gnu

          - target: powerpc64le-unknown-linux-gnu


    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cross
          key: cargo-home-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-${{ matrix.target }}-

      # 0.2.5 is the current crates.io release and dates from 2023; if it no
      # longer builds on current stable, or an image turns out to be too old,
      # switch to `--git https://github.com/cross-rs/cross`.
      # loongarch64-unknown-linux-gnu was tried here and removed: cross 0.2.5
      # cannot provide a std for it ("can't find crate for `std`"), while the
      # s390x/powerpc64le/riscv64gc/illumos images in the same release are
      # fine. Re-add together with a switch to `cross --git`, not before.
      - name: Install cross
        run: |
          command -v cross >/dev/null || cargo install cross --locked --version 0.2.5

      # See Cross.toml for why these two targets need -include cstddef and why
      # it is scoped rather than global. Cross.toml passes them through.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
          CXXFLAGS_s390x_unknown_linux_gnu: "-include cstddef"
          CXXFLAGS_powerpc64le_unknown_linux_gnu: "-include cstddef"
        run: cross build --locked --profile "$PROFILE" --target "$TARGET" --bin atomscan

      - name: Inspect
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: file "target/$TARGET/$PROFILE/atomscan"

      # A static musl binary runs on the runner as-is, so this is a real smoke
      # test rather than a `file` sanity check. Targets that can't execute here
      # (illumos, when it returns) just leave `smoke` unset.
      - name: Smoke test
        if: matrix.smoke
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -x
          "./target/$TARGET/$PROFILE/atomscan" --version
          "./target/$TARGET/$PROFILE/atomscan" --help >/dev/null

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ inputs.profile }}
        run: tar -czf "atomscan-$TARGET.tar.gz" -C "target/$TARGET/$PROFILE" atomscan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomscan-${{ matrix.target }}
          path: atomscan-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
