# Publish a release. Fires automatically on a `v*` tag:
#
#     git tag -s v2.4.0 -m "Atomdrift Scan 2.4.0"
#     git push origin v2.4.0
#
# It also dry-runs on demand from any ref, which is how you iterate on this
# pipeline without burning tags:
#
#     gh workflow run release.yml --ref my-branch
#
# To build and publish an existing tag with the latest workflow definition:
#
#     gh workflow run release.yml --ref main -f tag=v2.5.0 -f publish=true
#
# A dry run does everything a real one does — fat-LTO builds, whatever signing
# the inputs below ask for, packaging, checksums — and stops short of attesting
# or creating the release, leaving the assembled set as a downloadable artifact.
# That matters because the release-only surface (the `release-lto` profile, the
# signing path, this file's packaging steps) is precisely what ci.yml never
# exercises, so it is where the failures live. `workflow_dispatch` reads the
# workflow definition from the ref you dispatch. The optional `tag` input lets
# a repaired definition on main check out and publish an older tagged tree.
#
# This workflow is deliberately separate from ci.yml because it is the only one
# holding dangerous permissions — `contents: write` to publish, `id-token` and
# `attestations: write` to sign provenance, and the macOS Developer ID secrets.
# None of that is reachable from a pull_request trigger: tags on this repo can
# only be pushed by someone who already has write access.
#
# To require a human before anything is published, create a `release`
# environment (Settings -> Environments) with a required reviewer and add
# `environment: release` to the publish job. The build still runs; only the
# upload waits.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing v* tag to build. This recovery path lets a repaired workflow
          on the default branch publish artifacts for a release whose tag
          already exists.
        type: string
        default: ""
      publish:
        description: >-
          Create or populate the GitHub release. Off (the default) is a dry run.
          Requires a tag ref or the tag input; a tag push always publishes.
        type: boolean
        default: false

permissions: {}

concurrency:
  # A recovery dispatch comes from main, but it must serialize with any other
  # run for the requested tag. Different releases can proceed independently.
  group: release-${{ inputs.tag || github.ref_name }}
  # Never cancel a half-published release.
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      # A tag can be pushed without ever passing through PR CI, so the release
      # path repeats the guard rather than trusting that someone ran it.
      - name: Reject local path overrides
        run: |
          if grep -nE '^[[:space:]]*[^#].*path[[:space:]]*=[[:space:]]*"\.\.' Cargo.toml; then
            echo "::error file=Cargo.toml::local path override committed - refusing to release"
            exit 1
          fi

      # A tag push always publishes; a dispatch only does so when asked. On a
      # tag push the `inputs` context is empty, so the first operand carries it.
      - name: Resolve version
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          REQUESTED_TAG: ${{ inputs.tag || '' }}
        run: |
          set -eu
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          case "$GITHUB_REF" in
            refs/tags/*)
              TAG="${GITHUB_REF#refs/tags/}"
              ;;
            *)
              TAG="$REQUESTED_TAG"
              ;;
          esac
          if [ -n "$TAG" ]; then
            case "$TAG" in
              v*) ;;
              *)
                echo "::error::release tag must start with v (got $TAG)"
                exit 1
                ;;
            esac
            VERSION="${TAG#v}"
            if [ "$VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::tag $TAG does not match Cargo.toml version $CARGO_VERSION"
              exit 1
            fi
          else
            # Dry runs are the whole point of allowing a branch ref here, but
            # publishing off one would create a release nobody can reproduce
            # from a tag.
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::publishing requires a tag ref or the tag input (got $GITHUB_REF)"
              exit 1
            fi
            VERSION="$CARGO_VERSION"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ]; then
            echo "releasing $TAG (version $VERSION)"
          else
            echo "dry run at $GITHUB_REF (version $VERSION) - nothing will be published"
          fi

  build:
    name: build
    needs: verify
    uses: ./.github/workflows/build.yml
    # Ceiling for build.yml's jobs — see the same note in ci.yml. Checkout is
    # all they need; the release token stays in `publish`.
    permissions:
      contents: read
    with:
      # Normally empty for a branch dry run. A tag push and the manual recovery
      # input both make every matrix job build the tagged source, even though
      # the reusable workflow definition itself may come from a newer commit.
      ref: ${{ needs.verify.outputs.tag }}
      # Fat LTO + one codegen unit. Multi-minute links, and worth it for a
      # binary people download rather than rebuild.
      profile: release-lto
      # Both off until the Developer ID secrets exist — with none configured,
      # `sign: true` fails every macOS job on an empty .p12. Until then macOS
      # binaries carry an ad-hoc signature and downloaders see a Gatekeeper
      # prompt. Flip `sign` once the MACOS_CERT_* secrets are set, then
      # `notarize` once the MACOS_NOTARY_* ones are.
      sign: false
      notarize: false
    # Explicit, not `secrets: inherit` — the called workflow gets exactly these
    # six and nothing else. Passed even while signing is off so that turning it
    # on is a one-line change.
    secrets:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Add `environment: release` here to gate the upload on a human approval.
    permissions:
      contents: write      # create the release, upload assets
      id-token: write      # OIDC identity for provenance signing
      attestations: write  # record the provenance attestation
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: atomscan-*
          merge-multiple: true
          path: dist

      # `freebsd` and `cross` are continue-on-error, so a run goes green while
      # quietly shipping fewer platforms than it should. Deliberately a warning
      # rather than a failure — a broken experimental target shouldn't block the
      # ones that built — but the gap gets named instead of being invisible.
      - name: Inventory targets
        env:
          # Keep in sync with build.yml's matrices. Windows became a required
          # release target after its native build and smoke tests first passed
          # in run 30966163861. Solaris is release-bound now that its native
          # build can complete the fat-LTO link with ZFS-backed swap.
          EXPECTED: >-
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            aarch64-apple-darwin x86_64-apple-darwin
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl
            s390x-unknown-linux-gnu riscv64gc-unknown-linux-gnu
            powerpc64le-unknown-linux-gnu
            x86_64-unknown-freebsd x86_64-unknown-dragonfly
            x86_64-unknown-openbsd x86_64-unknown-netbsd
            x86_64-unknown-illumos x86_64-pc-solaris
            x86_64-pc-windows-msvc
        run: |
          set -eu
          missing=""
          for t in $EXPECTED; do
            if [ -f "dist/atomscan-$t.tar.gz" ]; then
              echo "  ok      $t"
            else
              echo "  MISSING $t"
              missing="$missing $t"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::release is missing targets:$missing"
            echo "Missing targets:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Artifacts are named by target; releases are named by version + target.
      - name: Assemble
        run: |
          set -eu
          cd dist
          for f in atomscan-*.tar.gz; do
            target="${f#atomscan-}"
            target="${target%.tar.gz}"
            mv "$f" "atomscan-$VERSION-$target.tar.gz"
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Signed, verifiable statement that these exact bytes came out of this
      # workflow at this commit. Consumers check it with:
      #   gh attestation verify atomscan-<version>-<target>.tar.gz \
      #     --repo atomdrift-project/scan
      # A recovery dispatch runs the repaired workflow from main while checking
      # out the requested tag. In that case github.sha identifies the workflow
      # commit, not the tagged source, so emitting the automatic attestation
      # would be misleading. Tag-push releases retain provenance attestation.
      - name: Attest provenance
        if: ${{ needs.verify.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz

      # `gh` ships on the runner, so publishing needs no third-party action in
      # the one job that holds `contents: write`. Add `--draft` if you'd rather
      # review before it goes live.
      - name: Publish release
        if: ${{ needs.verify.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading only missing assets"
            existing_assets="$(
              gh release view "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )"
            missing_assets=()
            for asset in dist/*.tar.gz dist/SHA256SUMS; do
              name="${asset##*/}"
              if printf '%s\n' "$existing_assets" | grep -Fqx -- "$name"; then
                echo "  exists  $name"
              else
                echo "  upload  $name"
                missing_assets+=("$asset")
              fi
            done
            if [ "${#missing_assets[@]}" -gt 0 ]; then
              gh release upload "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                "${missing_assets[@]}"
            else
              echo "all release assets already exist"
            fi
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Atomdrift Scan $VERSION" \
              --generate-notes \
              --verify-tag \
              dist/*.tar.gz dist/SHA256SUMS
          fi

      # Everything above ran except the two steps that leave a trace. Keep the
      # assembled set downloadable so a dry run is inspectable, not just green.
      - name: Upload dry-run artifacts
        if: ${{ needs.verify.outputs.publish != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: dist
          if-no-files-found: error
          retention-days: 7
